<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15161a">
  <title>OtoTR Test Kural Karar Merkezi</title>
  <style>:root{
  --red:#d71920;
  --red-dark:#a90e14;
  --red-soft:#fff0f1;
  --ink:#141518;
  --ink-2:#24272d;
  --muted:#6b7280;
  --line:#e5e7eb;
  --line-dark:#d5d8dd;
  --bg:#f5f6f8;
  --card:#ffffff;
  --green:#16804b;
  --green-soft:#eaf8f0;
  --amber:#a45a00;
  --amber-soft:#fff5df;
  --blue:#1769aa;
  --blue-soft:#eaf4ff;
  --purple:#6b46c1;
  --purple-soft:#f2edff;
  --shadow:0 10px 30px rgba(20,21,24,.08);
  --shadow-sm:0 4px 14px rgba(20,21,24,.07);
  --radius:16px;
  --radius-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.48}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.topbar{
  position:sticky;top:0;z-index:40;
  min-height:74px;
  display:flex;align-items:center;gap:18px;
  padding:12px 20px;
  color:#fff;background:linear-gradient(110deg,#111216 0%,#1a1b20 68%,#261013 100%);
  border-bottom:3px solid var(--red);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.brand{display:flex;align-items:center;gap:13px;min-width:250px}
.brand-mark{display:flex;align-items:center;gap:3px;font-weight:900;font-size:24px;letter-spacing:-1.4px;white-space:nowrap}
.brand-mark .oto{color:#fff}
.brand-mark .dash{color:var(--red);padding:0 1px}
.brand-mark .tr{border:2px solid var(--red);border-radius:5px;padding:0 5px 1px;color:#fff;line-height:1.05}
.brand-text strong{display:block;font-size:15px;letter-spacing:.1px}
.brand-text small{display:block;color:#aeb2bb;font-size:11px;margin-top:2px}
.top-progress{flex:1;min-width:220px;max-width:600px}
.top-progress-row{display:flex;justify-content:space-between;align-items:center;color:#d5d7dc;font-size:11px;margin-bottom:6px}
.progress-track{height:8px;border-radius:99px;background:#3a3c44;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff5a60);border-radius:99px;transition:width .25s ease}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{
  border:1px solid transparent;border-radius:9px;padding:9px 12px;
  background:#fff;color:var(--ink);font-weight:750;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;transition:.16s ease;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn-primary:hover{background:var(--red-dark)}
.btn-dark{background:#24262c;color:#fff;border-color:#383a42}
.btn-ghost{background:transparent;color:#fff;border-color:#4a4d57}
.btn-soft{background:#f3f4f6;border-color:#e2e4e8;color:#27292f}
.btn-danger-soft{background:var(--red-soft);border-color:#ffcdd0;color:var(--red-dark)}
.btn-success-soft{background:var(--green-soft);border-color:#c5ead5;color:var(--green)}
.btn-sm{min-height:31px;padding:6px 9px;font-size:11px;border-radius:7px}
.icon-btn{width:36px;height:36px;padding:0;border-radius:9px}
.workspace{
  display:grid;
  grid-template-columns:292px minmax(640px,1fr) 290px;
  gap:14px;
  max-width:1880px;
  margin:0 auto;
  padding:14px;
  align-items:start;
}
.sidebar,.inspector{
  position:sticky;top:91px;
  max-height:calc(100vh - 105px);
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.sidebar{padding:13px}
.inspector{padding:13px}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{
  width:100%;height:40px;border:1px solid var(--line-dark);border-radius:10px;
  padding:0 34px 0 12px;background:#fafafa;outline:none;
}
.search-wrap input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.11);background:#fff}
.search-wrap .search-icon{position:absolute;right:11px;top:10px;color:#8a8f99}
.segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:#f0f1f3;border-radius:10px;margin-bottom:12px}
.segmented button{border:0;border-radius:7px;background:transparent;padding:7px 3px;font-size:10px;font-weight:800;color:#666b75}
.segmented button.active{background:#fff;color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 7px;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.55px;color:#6d727d}
.group-list{display:flex;flex-direction:column;gap:6px}
.group-btn{
  width:100%;border:1px solid transparent;background:#fafafa;border-radius:11px;padding:9px 10px;text-align:left;
  display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;color:var(--ink);
}
.group-btn:hover{border-color:#dedfe3;background:#fff}
.group-btn.active{background:#fff1f2;border-color:#f4b4b7;box-shadow:inset 3px 0 0 var(--red)}
.group-no{width:28px;height:28px;border-radius:8px;background:#202228;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.group-btn.active .group-no{background:var(--red)}
.group-name{font-size:11px;font-weight:800;line-height:1.25}
.group-meta{display:block;font-size:9px;color:#8b9099;margin-top:3px;font-weight:600}
.group-count{font-size:10px;font-weight:850;color:#60646e;background:#eceef1;border-radius:99px;padding:3px 7px}
.item-list{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-dark)}
.item-btn{
  width:100%;border:1px solid transparent;background:#fff;border-radius:9px;padding:8px 8px;text-align:left;
  display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:start;
}
.item-btn:hover{background:#f8f8f9;border-color:#e5e6e9}
.item-btn.active{background:#1f2025;color:#fff;border-color:#1f2025}
.item-index{width:22px;height:22px;border-radius:7px;background:#eef0f2;color:#555a64;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}
.item-btn.active .item-index{background:var(--red);color:#fff}
.item-name{font-size:10.5px;font-weight:750;line-height:1.3}
.item-sub{font-size:9px;color:#969ba5;margin-top:3px}
.item-btn.active .item-sub{color:#b8bbc2}
.status-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:#d3d6db;border:2px solid #fff;box-shadow:0 0 0 1px #c9ccd1}
.status-dot.approved{background:var(--green);box-shadow:0 0 0 1px var(--green)}
.status-dot.error{background:var(--red);box-shadow:0 0 0 1px var(--red)}
.status-dot.unresolved{background:#f0a000;box-shadow:0 0 0 1px #f0a000}
.empty-list{padding:18px 8px;text-align:center;color:#8a8f99;font-size:11px}
.main{min-width:0}
.editor-shell{display:flex;flex-direction:column;gap:12px;padding-bottom:88px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.card-body{padding:16px 18px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--red);font-weight:900;margin-bottom:5px}
.item-title{font-size:24px;line-height:1.15;margin:0;letter-spacing:-.45px}
.item-meta-line{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;background:#f2f3f5;color:#5f6470;font-size:10px;font-weight:800;border:1px solid #e1e3e7}
.tag-red{background:var(--red-soft);color:var(--red-dark);border-color:#ffcfd1}
.tag-green{background:var(--green-soft);color:var(--green);border-color:#c6ead6}
.tag-amber{background:var(--amber-soft);color:var(--amber);border-color:#f4d99e}
.tag-blue{background:var(--blue-soft);color:var(--blue);border-color:#c7e1fa}
.tag-purple{background:var(--purple-soft);color:var(--purple);border-color:#daceff}
.header-status{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.big-status{padding:7px 11px;border-radius:9px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;background:#f0f1f3;color:#676c76}
.big-status.approved{background:var(--green-soft);color:var(--green)}
.big-status.error{background:var(--red-soft);color:var(--red-dark)}
.section-title{font-size:14px;font-weight:900;margin:0 0 4px}
.section-sub{font-size:11px;color:var(--muted);margin:0}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.span-2{grid-column:span 2}
.field.span-4{grid-column:1/-1}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.45px;color:#6e737d;font-weight:850}
.field select,.field input,.field textarea,.cell-input,.cell-select{
  width:100%;border:1px solid var(--line-dark);border-radius:9px;background:#fff;color:var(--ink);outline:none;
}
.field select,.field input,.cell-input,.cell-select{height:39px;padding:0 10px}
.field textarea{min-height:80px;padding:10px;resize:vertical}
.field select:focus,.field input:focus,.field textarea:focus,.cell-input:focus,.cell-select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.09)}
.toggle-line{display:flex;align-items:center;gap:9px;min-height:39px;border:1px solid var(--line-dark);border-radius:9px;padding:7px 10px;background:#fafafa}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch span{position:absolute;inset:0;background:#c7cbd2;border-radius:99px;transition:.15s}
.switch span:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;left:3px;top:3px;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.15s}
.switch input:checked+span{background:var(--red)}
.switch input:checked+span:after{transform:translateX(16px)}
.toggle-copy{font-size:11px;font-weight:750}
.rule-note{margin-top:12px;padding:11px 12px;border-radius:10px;background:#f7f7f8;border:1px dashed #d5d7dc;font-size:11px;color:#5f646f}
.source-inputs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.source-input-chip{padding:7px 9px;border-radius:8px;background:var(--blue-soft);border:1px solid #cbe3f8;color:var(--blue);font-size:10px;font-weight:800}
.options-card .card-body{padding:0}
.option-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 14px;background:#fafafb;border-bottom:1px solid var(--line)}
.toolbar-label{font-size:10px;font-weight:900;color:#686d77;text-transform:uppercase;letter-spacing:.4px;margin-right:2px}
.toolbar-spacer{flex:1}
.options-scroll{overflow:auto;max-height:none}
.option-table{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
.option-table th{position:sticky;top:0;z-index:4;background:#222329;color:#fff;padding:9px 8px;font-size:9px;text-transform:uppercase;letter-spacing:.4px;text-align:left;border-right:1px solid #393b43}
.option-table th:last-child{border-right:0}
.option-table td{padding:8px;border-bottom:1px solid #eceef1;vertical-align:middle;background:#fff}
.option-table tr:nth-child(even) td{background:#fafafa}
.option-table tr.row-invalid td{background:#fff7f7}
.option-table tr.row-selected td{box-shadow:inset 0 1px 0 #f1b9bc,inset 0 -1px 0 #f1b9bc}
.option-table tr.row-selected td:first-child{box-shadow:inset 3px 0 0 var(--red),inset 0 1px 0 #f1b9bc,inset 0 -1px 0 #f1b9bc}
.check-cell{text-align:center;width:34px}
.row-check{width:16px;height:16px;accent-color:var(--red)}
.option-code{display:flex;flex-direction:column;gap:2px;min-width:74px}
.option-code strong{font-size:10px}
.option-code small{font-size:9px;color:#8a8f99}
.unknown-code{color:var(--amber)!important}
.label-cell{min-width:210px}
.label-wrap{display:flex;gap:5px;align-items:center}
.label-wrap .cell-input{min-width:150px}
.label-warning{font-size:9px;color:var(--amber);font-weight:800;margin-top:3px}
.cell-select{min-width:132px;height:35px;font-size:11px;padding-right:26px}
.cell-input{height:35px;font-size:11px}
.evidence-cell{min-width:126px}
.evidence-toggle{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:750}
.evidence-toggle input{accent-color:var(--red)}
.auto-badge{font-size:8px;font-weight:900;color:var(--red);background:var(--red-soft);border-radius:5px;padding:2px 4px}
.note-cell{min-width:160px}
.inline-action{border:1px solid #dddfe4;background:#fff;border-radius:7px;height:34px;padding:0 8px;font-size:10px;font-weight:850;color:#545963}
.inline-action:hover{border-color:var(--red);color:var(--red)}
.add-option-wrap{padding:13px 14px;background:#fafafb;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.no-options{padding:22px 18px;text-align:center;background:#fafafa;border:1px dashed #d2d5da;border-radius:11px;margin:15px}
.no-options strong{display:block;margin-bottom:5px}
.validation-box{border-radius:11px;padding:11px 12px;margin-top:12px;font-size:11px}
.validation-box.ok{background:var(--green-soft);border:1px solid #c7ead6;color:#11693e}
.validation-box.warn{background:var(--amber-soft);border:1px solid #f1d59a;color:#895009}
.validation-list{margin:6px 0 0;padding-left:18px}
.summary-card .card-body{display:grid;gap:14px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.summary-box{border:1px solid var(--line);border-radius:12px;background:#fafafb;padding:12px}
.summary-box h3{margin:0 0 8px;font-size:12px}
.summary-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:900}
.summary-count.critical{background:var(--red-soft);color:var(--red-dark);border:1px solid #ffcdd0}
.summary-count.scope{background:var(--amber-soft);color:var(--amber);border:1px solid #f1d59a}
.summary-count.fault{background:#f2f3f5;color:#555a64;border:1px solid #d7dbe1}
.summary-count.ok{background:var(--green-soft);color:var(--green);border:1px solid #c7ead6}
.summary-list{margin:0;padding-left:18px;display:grid;gap:5px}
.summary-list li{font-size:11px;color:#39404a}
.summary-empty{font-size:11px;color:var(--muted)}
.summary-page{display:grid;gap:12px}
.summary-page-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.summary-page-head .section-sub{max-width:720px}
.summary-nav{display:flex;flex-wrap:wrap;gap:8px}
.summary-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;color:inherit}
.summary-link:hover{text-decoration:underline;color:var(--red-dark)}
.sticky-nav{
  position:fixed;z-index:30;bottom:12px;
  left:calc(292px + max(14px,(100vw - 1880px)/2 + 14px));
  right:calc(290px + max(14px,(100vw - 1880px)/2 + 14px));
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  background:rgba(23,24,28,.96);color:#fff;
  border:1px solid #3a3c44;border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.26);backdrop-filter:blur(10px)
}
.sticky-nav .nav-info{flex:1;min-width:0}
.nav-info strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-info small{font-size:9px;color:#adb1ba}
.inspector-section{padding:3px 2px 13px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.inspector-section:last-child{border-bottom:0;margin-bottom:0}
.inspector-title{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:#666b75;font-weight:900;margin:0 0 9px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat-box{padding:10px;border-radius:10px;background:#f7f7f8;border:1px solid #eaebee}
.stat-box strong{display:block;font-size:20px;line-height:1;color:#202126}
.stat-box span{display:block;font-size:9px;color:#787d87;margin-top:5px;font-weight:750}
.mini-progress{height:6px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:9px}
.mini-progress div{height:100%;background:var(--red);border-radius:99px}
.legend-list{display:flex;flex-direction:column;gap:7px}
.legend-row{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;font-size:10px;color:#5f646e}
.legend-code{border-radius:6px;padding:3px 5px;text-align:center;background:#202126;color:#fff;font-size:9px;font-weight:900}
.legend-code.g0{background:var(--green)}
.legend-code.g1{background:#6f7784}
.legend-code.g2{background:var(--amber)}
.legend-code.g3{background:var(--red)}
.issue-list{display:flex;flex-direction:column;gap:6px}
.issue-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:#fafafa;border:1px solid #eceef1;font-size:10px}
.issue-row strong{font-size:11px}
.issue-row.bad strong{color:var(--red)}
.issue-row.warn strong{color:var(--amber)}
.save-state{display:flex;align-items:center;gap:7px;font-size:10px;color:#7e838d}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{min-width:260px;max-width:430px;padding:11px 13px;border-radius:10px;background:#202126;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.25);font-size:11px;font-weight:700;animation:toastIn .2s ease}
.toast.ok{border-left:4px solid #35b977}
.toast.warn{border-left:4px solid #f2a51a}
.toast.error{border-left:4px solid var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(8,9,11,.67);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(640px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:17px 18px}
.modal-actions{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.close-btn{border:0;background:#f1f2f4;border-radius:8px;width:32px;height:32px;font-size:18px;color:#555a64}
.modal-list{margin:8px 0 0;padding-left:20px;color:#5e636d;font-size:11px}
.modal-list li{margin:5px 0}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings-grid .field.full{grid-column:1/-1}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa;font-size:11px}
.help-card strong{display:block;margin-bottom:5px}
.mobile-sidebar-toggle{display:none}
@media(max-width:1380px){
  .workspace{grid-template-columns:270px minmax(620px,1fr)}
  .inspector{display:none}
  .sticky-nav{left:calc(270px + 28px);right:14px}
}
@media(max-width:980px){
  .topbar{flex-wrap:wrap;padding:10px 12px}
  .brand{min-width:auto;flex:1}
  .brand-text{display:none}
  .top-progress{order:3;flex-basis:100%;max-width:none}
  .top-actions .btn-label{display:none}
  .workspace{display:block;padding:10px}
  .sidebar{position:fixed;left:10px;top:82px;bottom:10px;width:min(330px,calc(100vw - 20px));max-height:none;z-index:60;transform:translateX(-115%);transition:.2s ease}
  .sidebar.open{transform:none}
  .mobile-sidebar-toggle{display:inline-flex}
  .sticky-nav{left:10px;right:10px;bottom:8px}
  .form-grid{grid-template-columns:1fr 1fr}

  <script>(() => {
  'use strict';

  const SOURCE = JSON.parse(document.getElementById('source-data').textContent);
  const STORAGE_KEY = 'ototr.test-rule-editor.v1';
  const PROJECT_TYPE = 'OTOTR_TEST_RULE_EDITOR';
  const APP_VERSION = '1.0.0';

  const DEFINITIONS = {
    severities: {
      UYGUN: 'Uygun / Sorunsuz',
      BILGI: 'Bilgi / Beyan',

      UYGULANMAZ: 'Uygulanmaz'

    guaranteeEffects: {
      G0: 'Etkilemez',
      G1: 'Beyanlı / Kapsam Dışı',
      G2: 'Düzeltme-Onarım Sonrası',
      G3: 'Kesin Engel'
    },
    photoPolicies: {
      F0: 'Ek zorunluluk yok',
      F1: 'Her sonuçta kanıt zorunlu',
      F2: 'Olumsuz / kontrol sonucunda',
      F3: 'Yalnız kritik sonucunda',
      F4: 'Cihaz / belge çıktısı zorunlu'

    evidenceTypes: {

      DOCUMENT: 'Belge / sorgu ekranı',
      DEVICE: 'Cihaz çıktısı',

      PHOTO_DOCUMENT: 'Fotoğraf + belge',
      VIDEO: 'Video',
      OTHER: 'Diğer kanıt'
    },
    descriptionPolicies: {
      D0: 'Ek zorunluluk yok',
      D1: 'Olumsuz / kontrol sonucunda',
      D2: 'Kritik veya G2–G3 sonucunda',
      D3: 'Her sonuçta açıklama zorunlu'
    }
  };

  const groups = SOURCE.groups;
  const allItems = [];
  const itemById = new Map();
  const groupById = new Map();
  const unknownCodeUsage = new Map();

  groups.forEach(group => {
    groupById.set(group.groupId, group);
    group.items.forEach(item => {
      allItems.push(item);
      itemById.set(item.itemId, item);
      item.groupId = group.groupId;
      item.groupTitle = group.title;
      item.groupNo = group.groupNo;
      item.moduleTitle = group.moduleTitle;
      item.searchText = normalizeText([
        group.title,
        group.moduleTitle,
        item.title,
        item.noktaId,
        ...item.options.map(o => o.label || o.value)
      ].join(' '));
      item.options.forEach(option => {
        if (option.unknown) {
          const key = String(option.value);
          const arr = unknownCodeUsage.get(key) || [];
          arr.push({ itemId: item.itemId, optionId: option.optionId });
          unknownCodeUsage.set(key, arr);
        }
      });
    });
  });

    toastStack: document.getElementById('toastStack'),
    modalRoot: document.getElementById('modalRoot'),
    saveStateText: document.getElementById('saveStateText')
  };

  let state = loadState() || createInitialState();
  let selectedRows = new Set();
  let saveTimer = null;
  let lastSavedAt = null;

  normalizeState();
  applyInitialDecisionIfMissing();
  ensureCurrentSelection();
  bindGlobalEvents();
  renderAll();
  persistState(true);

  window.__OTOTR_APP__ = {
    getState: () => structuredClone(state),
    getSource: () => SOURCE,
    validateProject,
    buildFinalExport,
    buildFlatRows,
    exportDeveloperZip,
    selectItem: itemId => selectItem(itemId)
  };

  function createInitialState() {
    return {
      projectType: PROJECT_TYPE,
      appVersion: APP_VERSION,
      projectVersion: 1,
      projectId: 'ototr-7-gun-1000-km-geri-alim',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      selectedGroupId: groups[0]?.groupId || '',
      selectedItemId: allItems[0]?.itemId || '',
      currentView: 'editor',
      filter: 'all',
      search: '',
      settings: {
        projectName: 'OtoTR Test Maddeleri Kural Çalışması',
        guaranteeName: '7 Gün / 1000 km Geri Alım Garantisi',
        guaranteeType: 'BUYBACK',
        guaranteeDays: 7,
        guaranteeKm: 1000,
        automaticEvidenceForCriticalAndG2G3: true,
        automaticDescriptionForCriticalAndG2G3: true
      },
      globalLabelOverrides: {},
      itemRules: {},
      auditLog: []
    };
  }

  function normalizeState() {
    if (!state || typeof state !== 'object') state = createInitialState();
    state.projectType = PROJECT_TYPE;
    state.appVersion = APP_VERSION;
    state.currentView = state.currentView === 'summary' ? 'summary' : 'editor';
    state.settings = Object.assign(createInitialState().settings, state.settings || {});
    state.globalLabelOverrides = state.globalLabelOverrides || {};
    state.itemRules = state.itemRules || {};
    state.auditLog = Array.isArray(state.auditLog) ? state.auditLog : [];
    Object.values(state.itemRules).forEach(rule => {
      rule.optionRules = rule.optionRules || {};
      rule.customOptions = Array.isArray(rule.customOptions) ? rule.customOptions : [];
      rule.removedOptionIds = Array.isArray(rule.removedOptionIds) ? rule.removedOptionIds : [];
    });
    state.filter = ['all', 'pending', 'approved', 'unresolved'].includes(state.filter) ? state.filter : 'all';
    state.search = state.search || '';
  }

  function applyInitialDecisionIfMissing() {
    const item = itemById.get('n1591-arac-rehinli-mi');
    if (!item || state.itemRules[item.itemId]) return;
    const rule = getDefaultItemRule(item);
    rule.reviewStatus = 'approved';
    rule.approvedAt = new Date().toISOString();
    rule.approvedBy = 'Volkan';
    rule.photoPolicy = 'F2';
    rule.evidenceType = 'DOCUMENT';
    rule.minEvidenceCount = 1;
    rule.descriptionPolicy = 'D2';
    rule.guaranteeRelevant = true;
    rule.itemNote = 'Kullanıcı kararı: Araç rehinli ise 7 gün / 1000 km geri alım garantisine kesin engeldir.';

    const byLabel = Object.fromEntries(item.options.map(o => [normalizeText(o.label || o.value), o]));
    setInitialOption(rule, byLabel['evet'], {
      finalLabel: 'EVET', severity: 'KRITIK', guaranteeEffect: 'G3', manualEvidenceRequired: true,
      optionNote: 'Rehin/sorgu belgesi zorunlu. Garantiye kesin engel.'
    });
    setInitialOption(rule, byLabel['hayir'], {
      finalLabel: 'HAYIR', severity: 'UYGUN', guaranteeEffect: 'G0', manualEvidenceRequired: false,
      optionNote: ''
    });
    setInitialOption(rule, byLabel['bilmiyorum'], {
      finalLabel: 'BİLMİYORUM', severity: 'KONTROL_BEKLIYOR', guaranteeEffect: 'G2', manualEvidenceRequired: true,
      optionNote: 'Resmî sorgu sonucu görülmeden garanti onayı verilmez.'
    });
    state.itemRules[item.itemId] = rule;
    state.auditLog.push({
      at: new Date().toISOString(),
      action: 'INITIAL_DECISION',
      itemId: item.itemId,
      itemTitle: item.title,
      detail: 'EVET seçeneği KRİTİK ve G3 — garantiye kesin engel olarak kaydedildi.'
    });
  }

  function setInitialOption(itemRule, option, values) {
    if (!option) return;
    itemRule.optionRules[option.optionId] = Object.assign(getDefaultOptionRule(option), values);
  }

  function ensureCurrentSelection() {
    if (!groupById.has(state.selectedGroupId)) state.selectedGroupId = groups[0]?.groupId || '';
    if (!itemById.has(state.selectedItemId)) {
      const group = groupById.get(state.selectedGroupId);
      state.selectedItemId = group?.items[0]?.itemId || allItems[0]?.itemId || '';
    }
    const selected = itemById.get(state.selectedItemId);
    if (selected && selected.groupId !== state.selectedGroupId) state.selectedGroupId = selected.groupId;
  }

  function getDefaultItemRule(item) {
    return {
      reviewStatus: 'pending',
      touched: false,
      approvedAt: null,
      approvedBy: null,
      photoPolicy: 'F0',
      evidenceType: 'PHOTO',
      minEvidenceCount: 1,
      descriptionPolicy: 'D0',
      guaranteeRelevant: true,
      measurementRequired: item.inputs.length > 0,
      customRuleText: '',
      itemNote: '',
      optionRules: {},
      customOptions: [],
      removedOptionIds: []
    };
  }

  function getDefaultOptionRule(option) {
    const globalLabel = option.unknown ? state.globalLabelOverrides[String(option.value)] : '';
    return {
      finalLabel: option.label || globalLabel || '',
      severity: '',
      guaranteeEffect: '',
      manualEvidenceRequired: false,
      manualDescriptionRequired: false,
      optionNote: ''
    };
  }

  function ensureItemRule(item) {
    if (!state.itemRules[item.itemId]) state.itemRules[item.itemId] = getDefaultItemRule(item);
    return state.itemRules[item.itemId];
  }

  function readItemRule(item) {
    return state.itemRules[item.itemId] || getDefaultItemRule(item);
  }

  function ensureOptionRule(item, option) {
    const itemRule = ensureItemRule(item);
    if (!itemRule.optionRules[option.optionId]) itemRule.optionRules[option.optionId] = getDefaultOptionRule(option);
    const rule = itemRule.optionRules[option.optionId];
    if (!rule.finalLabel && option.unknown && state.globalLabelOverrides[String(option.value)]) {
      rule.finalLabel = state.globalLabelOverrides[String(option.value)];
    }
    return rule;
  }

  function readOptionRule(item, itemRule, option) {
    const stored = itemRule.optionRules?.[option.optionId];
    const defaults = getDefaultOptionRule(option);
    return Object.assign(defaults, stored || {});
  }

  function getCombinedOptions(item, itemRule) {
    const removed = new Set(itemRule.removedOptionIds || []);
    const sourceOptions = item.options
      .filter(o => !removed.has(o.optionId))
      .map(o => Object.assign({ custom: false }, o));
    const custom = (itemRule.customOptions || []).map((o, idx) => ({
      optionId: o.optionId || `custom-${idx + 1}`,
      value: o.value || o.optionId || `custom-${idx + 1}`,
      label: o.label || '',
      unknown: false,
      optionType: 'custom',
      sourceText: 'Kullanıcı tarafından eklendi',
      custom: true
    }));
    return sourceOptions.concat(custom);
  }

  function renderAll() {
    renderHeader();
    renderSidebar();
    renderMain();
    renderInspector();
    renderStickyNav();
  }

  function renderHeader() {
    const v = validateProject();
    const pctRaw = v.totalItems ? (v.approvedItems / v.totalItems * 100) : 0;
    const pct = pctRaw > 0 && pctRaw < 1 ? pctRaw.toFixed(1) : Math.round(pctRaw);
    dom.topProgressFill.style.width = `${pctRaw}%`;
    dom.topProgressText.textContent = `${v.approvedItems} / ${v.totalItems} madde onaylandı · %${pct}`;
    dom.sourceStats.textContent = `${SOURCE.stats.groupCount} başlık · ${SOURCE.stats.itemCount} madde · ${SOURCE.stats.optionCount} seçenek`;
    if (dom.saveStateText) {
      dom.saveStateText.textContent = lastSavedAt ? `Kaydedildi ${formatTime(lastSavedAt)}` : 'Otomatik kayıt açık';
    }
  }

  function renderSidebar() {
    dom.searchInput.value = state.search || '';
    dom.filterBar.querySelectorAll('button').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === state.filter));

    dom.groupList.innerHTML = groups.map(group => {
      const progress = groupProgress(group);
      return `<button class="group-btn ${group.groupId === state.selectedGroupId ? 'active' : ''}" data-action="select-group" data-group-id="${escapeAttr(group.groupId)}">
        <span class="group-no">${String(group.groupNo).padStart(2, '0')}</span>
        <span class="group-name">${escapeHTML(group.title)}<span class="group-meta">${escapeHTML(group.moduleTitle || '')}</span></span>
        <span class="group-count">${progress.approved}/${progress.total}</span>
      </button>`;
    }).join('');

    const search = normalizeText(state.search || '');
    let items;
    if (search) {
      items = allItems.filter(item => item.searchText.includes(search));
    } else {
      items = groupById.get(state.selectedGroupId)?.items || [];
    }
    items = items.filter(item => itemPassesFilter(item));

    dom.itemList.innerHTML = items.length ? items.map(item => {
      const status = getItemStatusInfo(item);
      return `<button class="item-btn ${item.itemId === state.selectedItemId ? 'active' : ''}" data-action="select-item" data-item-id="${escapeAttr(item.itemId)}">
        <span class="item-index">${item.globalIndex}</span>
        <span class="item-name">${escapeHTML(item.title)}<span class="item-sub">Nokta ${escapeHTML(item.noktaId)} · ${item.options.length} seçenek</span></span>
        <span class="status-dot ${status.dotClass}" title="${escapeAttr(status.label)}"></span>
      </button>`;
    }).join('') : `<div class="empty-list">Bu filtreye uyan madde bulunamadı.</div>`;
  }

  function renderMain() {
    if (state.currentView === 'summary') {
      dom.mainEditor.innerHTML = renderSummaryPage();
      return;
    }
    const item = itemById.get(state.selectedItemId);
    if (!item) {
      dom.mainEditor.innerHTML = '<div class="card"><div class="card-body">Madde bulunamadı.</div></div>';
      return;
    }
    const itemRule = ensureItemRule(item);
    const validation = validateItem(item, itemRule);
    const options = getCombinedOptions(item, itemRule);
    const statusClass = itemRule.reviewStatus === 'approved' ? 'approved' : (validation.errors.length ? 'error' : '');
    const statusText = itemRule.reviewStatus === 'approved' ? 'Onaylandı' : (validation.errors.length ? 'Eksik Karar' : 'Taslak');

    dom.mainEditor.innerHTML = `<div class="editor-shell">
      <section class="card item-header-card">
        <div class="card-head">
          <div>
            <div class="eyebrow">${String(item.groupNo).padStart(2, '0')} · ${escapeHTML(item.groupTitle)}</div>
            <h1 class="item-title">${escapeHTML(item.title)}</h1>
            <div class="item-meta-line">
              <span class="tag">Madde ${item.globalIndex}/${SOURCE.stats.itemCount}</span>
              <span class="tag">Nokta ID: <span class="mono">${escapeHTML(item.noktaId)}</span></span>
              <span class="tag">${options.length} sonuç seçeneği</span>
              <span class="tag ${item.unresolvedOptionCount ? 'tag-amber' : 'tag-green'}">${item.unresolvedOptionCount ? `${item.unresolvedOptionCount} etiketsiz kod` : 'Kaynak etiketleri hazır'}</span>
              ${item.inputs.length ? `<span class="tag tag-blue">${item.inputs.length} ölçüm alanı</span>` : ''}
            </div>
          </div>
          <div class="header-status">
            <span class="big-status ${statusClass}">${statusText}</span>
            ${itemRule.approvedAt ? `<small class="muted">${formatDateTime(itemRule.approvedAt)}</small>` : ''}
          </div>
        </div>
      </section>

      ${renderItemRuleCard(item, itemRule)}
      ${renderOptionsCard(item, itemRule, options, validation)}
      ${renderNotesCard(itemRule, validation)}
    </div>`;
  }

  function renderItemRuleCard(item, rule) {
    const inputChips = item.inputs.length ? `<div class="source-inputs">${item.inputs.map(input => `<span class="source-input-chip">${escapeHTML(input.inputType.toUpperCase())}: ${escapeHTML(input.label || 'Alan')}</span>`).join('')}</div>` : '';
    return `<section class="card">
      <section class="card">
        <div><h2 class="section-title">Madde Kuralı ve Kanıt Zorunluluğu</h2><p class="section-sub">Fotoğraf/belge zorunluluğunu ve garanti kapsamını bu madde için belirle.</p></div>
        <button class="btn btn-sm btn-soft" data-action="open-help">Kodların Açıklaması</button>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="field">
            <label>Fotoğraf / Kanıt Kuralı</label>
            <select data-item-field="photoPolicy">
              ${optionTags(DEFINITIONS.photoPolicies, rule.photoPolicy)}
            </select>
          </div>
          <div class="field">
            <label>Kanıt Türü</label>
            <select data-item-field="evidenceType">
              ${optionTags(DEFINITIONS.evidenceTypes, rule.evidenceType)}
            </select>
          </div>
          <div class="field">
            <label>Minimum Kanıt Adedi</label>
            <select data-item-field="minEvidenceCount">
              ${[1,2,3].map(n => `<option value="${n}" ${Number(rule.minEvidenceCount) === n ? 'selected' : ''}>${n} adet</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Açıklama Kuralı</label>
            <select data-item-field="descriptionPolicy">
              ${optionTags(DEFINITIONS.descriptionPolicies, rule.descriptionPolicy)}
            </select>
          </div>
          <div class="field span-2">
            <label>Garanti Değerlendirmesi</label>
            <div class="toggle-line">
              <label class="switch"><input type="checkbox" data-item-field="guaranteeRelevant" ${rule.guaranteeRelevant ? 'checked' : ''}><span></span></label>
              <span class="toggle-copy">Bu madde ${escapeHTML(state.settings.guaranteeName)} kararına dahil edilsin</span>
            </div>
          </div>
          <div class="field span-2">
            <label>Ölçüm Alanı Zorunluluğu</label>
            <div class="toggle-line">
              <label class="switch"><input type="checkbox" data-item-field="measurementRequired" ${rule.measurementRequired ? 'checked' : ''} ${item.inputs.length ? '' : 'disabled'}><span></span></label>
              <span class="toggle-copy">${item.inputs.length ? 'Kaynak ölçüm alanı doldurulmadan madde tamamlanamasın' : 'Bu maddede kaynak ölçüm alanı bulunmuyor'}</span>
            </div>
          </div>
          <div class="field span-4">
            <label>Seçeneksiz / Özel Kural Açıklaması</label>
            <textarea data-item-field="customRuleText" placeholder="Örneğin: Muayene tarihi geçmişse G2; geçerliyse G0. Serbest metin maddelerinde uygulanacak kuralı yazın.">${escapeHTML(rule.customRuleText || '')}</textarea>
          </div>
        </div>
        <div class="rule-note"><strong>Otomatik güvenlik kuralı:</strong> Kritik veya G2–G3 olarak işaretlenen bir sonuçta en az ${rule.minEvidenceCount || 1} kanıt ve açıklama zorunlu hale gelir. Madde kuralı bunun üzerine ek zorunluluk getirir.</div>
        ${inputChips}
      </div>
    </section>`;
  }

  function renderOptionsCard(item, itemRule, options, validation) {
    if (!options.length) {
      return `<section class="card options-card">
        <div class="card-head"><div><h2 class="section-title">Sonuç Seçenekleri</h2><p class="section-sub">Kaynakta seçenek bulunmuyor. Kural metni yazabilir veya özel seçenek ekleyebilirsin.</p></div></div>
        <div class="no-options"><strong>Bu maddede hazır seçenek yok.</strong><span class="muted">Örneğin “Geçerli / Süresi geçmiş” ya da “Onaylandı / Onaylanmadı” seçeneklerini ekleyebilirsin.</span><div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-action="add-custom-option">+ Özel Seçenek Ekle</button></div></div>
      </section>`;
    }

    const rows = options.map((option, idx) => renderOptionRow(item, itemRule, option, idx, validation)).join('');
    return `<section class="card options-card">
      <div class="card-head">
        <div><h2 class="section-title">Seçenek Bazlı Kritik ve Garanti Kararları</h2><p class="section-sub">Her sonuç seçeneğine önem kategorisi, G0–G3 etkisi ve kanıt zorunluluğu ata.</p></div>
        <span class="tag ${validation.optionCompleteCount === options.length ? 'tag-green' : 'tag-amber'}">${validation.optionCompleteCount}/${options.length} seçenek tamam</span>
      </div>
      <div class="option-toolbar">
        <span class="toolbar-label"><span id="selectedRowCount">${selectedRows.size}</span> seçili</span>
        <button class="btn btn-sm btn-soft" data-action="select-all-options">Tümünü Seç</button>
        <button class="btn btn-sm btn-success-soft" data-action="bulk-preset" data-preset="positive">Uygun · G0</button>
        <button class="btn btn-sm btn-soft" data-action="bulk-preset" data-preset="declared">Kusur · G1</button>
        <button class="btn btn-sm btn-soft" data-action="bulk-preset" data-preset="repair">Onarım · G2</button>
        <button class="btn btn-sm btn-danger-soft" data-action="bulk-preset" data-preset="critical">Kritik · G3</button>
        <button class="btn btn-sm btn-soft" data-action="bulk-preset" data-preset="control">Kontrol · G2</button>
        <span class="toolbar-spacer"></span>
        <button class="btn btn-sm btn-dark" data-action="apply-smart-suggestions">Metne Göre Taslak Öner</button>
      </div>
      <div class="options-scroll">
        <table class="option-table">
          <thead><tr>
            <th style="width:36px"><input type="checkbox" class="row-check" data-action="toggle-all-visible" aria-label="Tüm seçenekleri seç"></th>
            <th>Kaynak</th>
            <th>Son Kullanıcı Etiketi</th>
            <th>Önem Kategorisi</th>
            <th>1000 km Garanti Etkisi</th>
            <th>Kanıt</th>
            <th>Seçenek Notu</th>
            <th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="add-option-wrap"><span class="muted">Kaynakta olmayan yeni bir sonuç seçeneği gerekiyorsa ekleyebilirsin.</span><button class="btn btn-sm btn-soft" data-action="add-custom-option">+ Özel Seçenek Ekle</button></div>
    </section>`;
  }

  function renderOptionRow(item, itemRule, option, idx, validation) {
    const rule = readOptionRule(item, itemRule, option);
    const rowErrors = validation.optionErrors[option.optionId] || [];
    const effectiveEvidence = isEvidenceRequired(itemRule, rule);
    const selected = selectedRows.has(option.optionId);
    const sourceLabel = option.label || `Kod ${option.value}`;
    const globalCount = option.unknown ? (unknownCodeUsage.get(String(option.value))?.length || 1) : 0;
    return `<tr class="${rowErrors.length ? 'row-invalid' : ''} ${selected ? 'row-selected' : ''}" data-option-row="${escapeAttr(option.optionId)}">
      <td class="check-cell"><input class="row-check" type="checkbox" data-action="toggle-option-row" data-option-id="${escapeAttr(option.optionId)}" ${selected ? 'checked' : ''}></td>
      <td><div class="option-code"><strong class="${option.unknown ? 'unknown-code' : ''}">${escapeHTML(sourceLabel)}</strong><small>${option.custom ? 'Özel seçenek' : escapeHTML(option.optionType)}${option.unknown ? ` · ${globalCount} kullanım` : ''}</small></div></td>
      <td class="label-cell">
        <div class="label-wrap">
          <input class="cell-input" data-option-field="finalLabel" data-option-id="${escapeAttr(option.optionId)}" value="${escapeAttr(rule.finalLabel || '')}" placeholder="${option.unknown ? `Kod ${escapeAttr(option.value)} için ad yazın` : 'Seçenek etiketi'}">
          ${option.unknown && globalCount > 1 ? `<button class="inline-action" data-action="apply-label-global" data-option-id="${escapeAttr(option.optionId)}" title="Aynı kaynak kodunun tüm kullanımlarına uygula">Tümüne</button>` : ''}
        </div>
        ${option.unknown && !rule.finalLabel ? `<div class="label-warning">Ham kod kullanıcıya gösterilemez.</div>` : ''}
      </td>
      <td>
        <select class="cell-select" data-option-field="severity" data-option-id="${escapeAttr(option.optionId)}">
          <option value="">Seçiniz…</option>${optionTags(DEFINITIONS.severities, rule.severity)}
        </select>
      </td>
      <td>
        <select class="cell-select" data-option-field="guaranteeEffect" data-option-id="${escapeAttr(option.optionId)}" ${itemRule.guaranteeRelevant ? '' : 'disabled'}>
          <option value="">${itemRule.guaranteeRelevant ? 'Seçiniz…' : 'Kapsam dışı'}</option>${optionTags(DEFINITIONS.guaranteeEffects, rule.guaranteeEffect)}
        </select>
      </td>
      <td class="evidence-cell">
        <label class="evidence-toggle"><input type="checkbox" data-option-field="manualEvidenceRequired" data-option-id="${escapeAttr(option.optionId)}" ${rule.manualEvidenceRequired ? 'checked' : ''}> Elle zorunlu ${effectiveEvidence && !rule.manualEvidenceRequired ? '<span class="auto-badge">OTOMATİK</span>' : ''}</label>
      </td>
      <td class="note-cell"><input class="cell-input" data-option-field="optionNote" data-option-id="${escapeAttr(option.optionId)}" value="${escapeAttr(rule.optionNote || '')}" placeholder="Kısa kural notu"></td>
      <td>${renderOptionActions(option)}</td>
    </tr>`;
  }

  function renderOptionActions(option) {
    if (option.custom) {
      return `<button class="inline-action" data-action="remove-custom-option" data-option-id="${escapeAttr(option.optionId)}">Sil</button>`;
    }
    if (option.unknown) {
      return `<button class="inline-action" data-action="remove-source-option" data-option-id="${escapeAttr(option.optionId)}" title="Bu kodu bu maddeden gizle">Sil</button>`;
    }
    return '';
  }

  function renderSummaryPage() {
    const summary = buildDecisionSummary();
    return `<div class="summary-page">
      <section class="card">
        <div class="card-head summary-page-head">
          <div><h1 class="item-title">Karar Ozeti</h1><p class="section-sub">Kritik, 1000 km kapsam disi, kusurlu ve uygun kararlari ayri yan sayfada takip edin. Listedeki satira tiklayarak ilgili maddeye gidip duzenleme yapabilirsiniz.</p></div>
          <div class="summary-nav"><button class="btn btn-soft" data-action="back-to-editor">Duzenlemeye Don</button></div>
        </div>
      </section>
      <section class="card summary-card">
        <div class="card-body">
          <div class="summary-grid">
            ${renderSummaryBox('Kritik Maddeler', 'critical', summary.critical)}
            ${renderSummaryBox('1000 Km Kapsam D??? Birakanlar', 'scope', summary.outOfScope)}
            ${renderSummaryBox('Kusurlu Maddeler', 'fault', summary.faulty)}
            ${renderSummaryBox('Uygun Maddeler', 'ok', summary.approved)}
          </div>
        </div>
      </section>
    </div>`;
  }

  function renderSummaryBox(title, tone, entries) {
    return `<section class="summary-box">
      <h3>${escapeHTML(title)} <span class="summary-count ${tone}">${entries.length}</span></h3>
      ${entries.length ? `<ul class="summary-list">${entries.map(entry => `<li><button class="summary-link" data-action="jump-summary-item" data-item-id="${escapeAttr(entry.itemId)}">${escapeHTML(entry.text)}</button></li>`).join('')}</ul>` : `<div class="summary-empty">Henuz kayit yok.</div>`}
    </section>`;
  }

  function buildDecisionSummary() {
    const summary = {
      critical: [],
      outOfScope: [],
      faulty: [],
      approved: []
    };
    allItems.forEach(item => {
      const itemRule = readItemRule(item);
      getCombinedOptions(item, itemRule).forEach(option => {
        const optionRule = readOptionRule(item, itemRule, option);
        const label = String(optionRule.finalLabel || option.label || option.value || '').trim();
        if (!label) return;
        const line = { itemId: item.itemId, text: `${item.title} -> ${label}` };
        if (optionRule.severity === 'KRITIK') summary.critical.push(line);
        if (optionRule.guaranteeEffect === 'G3') summary.outOfScope.push(line);
        if (optionRule.severity === 'KUSURLU') summary.faulty.push(line);
        if (optionRule.severity === 'UYGUN' && optionRule.guaranteeEffect === 'G0') summary.approved.push(line);
      });
    });
    return summary;
  }

  function renderNotesCard(rule, validation) {
    const boxClass = validation.errors.length ? 'warn' : 'ok';
    const validationHtml = validation.errors.length
      ? `<strong>Bu madde henüz onaya hazır değil.</strong><ul class="validation-list">${validation.errors.slice(0, 8).map(e => `<li>${escapeHTML(e)}</li>`).join('')}${validation.errors.length > 8 ? `<li>+${validation.errors.length - 8} ek eksik</li>` : ''}</ul>`
      : '<strong>Madde onaya hazır.</strong> Seçenek etiketleri, önem kategorileri ve garanti etkileri tamamlandı.';
    return `<section class="card">
      <div class="card-head"><div><h2 class="section-title">Karar Notu ve Son Kontrol</h2><p class="section-sub">Yazılımcının bilmesi gereken maddeye özel açıklamayı ekle.</p></div></div>
      <div class="card-body">
        <div class="field"><label>Madde Notu</label><textarea data-item-field="itemNote" placeholder="Uygulama davranışı, istisna veya rapor notunu yazın.">${escapeHTML(rule.itemNote || '')}</textarea></div>
        <div class="validation-box ${boxClass}">${validationHtml}</div>
      </div>
    </section>`;
  }

        <div class="legend-row"><span class="legend-code g1">G1</span><span><strong>Beyanlı</strong><br>Bulgu açıklanır veya ilgili parça kapsam dışı kalır.</span></div>
        <div class="legend-row"><span class="legend-code g2">G2</span><span><strong>Şartlı</strong><br>Düzeltme, onarım ya da doğrulama sonrası karar.</span></div>

  function renderStickyNav() {
    if (state.currentView === 'summary') {
      dom.stickyNav.innerHTML = `<button class="btn btn-dark" data-action="back-to-editor">Duzenlemeye Don</button><div class="nav-info"><strong>Karar Ozeti</strong><small>Ozet listesinden madde secerek duzenleme ekranina gecebilirsiniz.</small></div>`;
      return;
    }
    const item = itemById.get(state.selectedItemId);
    if (!item) return;

    const validation = validateItem(item, rule);
    dom.stickyNav.innerHTML = `<button class="btn btn-dark" data-action="previous-item">??? ??nceki</button>
      <div class="nav-info"><strong>${escapeHTML(item.title)}</strong><small>${validation.errors.length ? `${validation.errors.length} eksik karar` : 'Onaya haz??r'} ?? Otomatik kay??t a????k</small></div>
      ${rule.reviewStatus === 'approved' ? `<button class="btn btn-soft" data-action="revoke-approval">Onay?? Kald??r</button>` : ''}
      <button class="btn btn-dark" data-action="next-item">Atla ???</button>
      <button class="btn btn-primary" data-action="approve-next">Onayla ve Sonraki ???</button>`;
  }

  function bindGlobalEvents() {
    document.addEventListener('click', handleClick);
    document.addEventListener('change', handleChange);
    document.addEventListener('input', handleInput);
    document.addEventListener('keydown', handleKeydown);

    dom.searchInput.addEventListener('input', e => {
      state.search = e.target.value;
      scheduleSave();
      renderSidebar();
    });

    dom.importFile.addEventListener('change', importProjectFile);
    window.addEventListener('beforeunload', () => persistState(true));
  }

  function handleClick(event) {
    if (event.target.matches('[data-modal-backdrop]')) { closeModal(); return; }
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    if (action === 'select-group') {
      const group = groupById.get(target.dataset.groupId);
      if (!group) return;
      state.selectedGroupId = group.groupId;
      state.search = '';
      state.filter = 'all';
      const first = group.items.find(item => itemPassesFilter(item)) || group.items[0];
      if (first) state.selectedItemId = first.itemId;
      selectedRows.clear();
      scheduleSave();
      renderAll();
      closeMobileSidebar();
      return;
    }

    if (action === 'select-item') {
      selectItem(target.dataset.itemId);
      closeMobileSidebar();
      return;
    }

    if (action === 'set-filter') {
      state.filter = target.dataset.filter;
      scheduleSave();
      renderSidebar();
      return;
    }

    if (action === 'toggle-sidebar') {
      dom.sidebar.classList.toggle('open');
      return;
    }

    if (action === 'previous-item') return navigateRelative(-1);
    if (action === 'next-item') return navigateRelative(1);
    if (action === 'approve-next') return approveCurrentAndNext();
    if (action === 'revoke-approval') return revokeCurrentApproval();
    if (action === 'open-help') return openHelpModal();
    if (action === 'open-summary') return openSummaryPage();
    if (action === 'back-to-editor') return backToEditor();
    if (action === 'jump-summary-item') return jumpToSummaryItem(target.dataset.itemId);
    if (action === 'open-settings') return openSettingsModal();
    if (action === 'open-export') return openExportModal();
    if (action === 'download-backup') return downloadProjectBackup();
    if (action === 'trigger-import') { dom.importFile.value = ''; dom.importFile.click(); return; }
    if (action === 'reset-project') return confirmResetProject();
    if (action === 'close-modal') return closeModal();
    if (action === 'save-settings') return saveSettingsFromModal();
    if (action === 'export-final-json') return downloadFinalJson();
    if (action === 'export-flat-csv') return downloadFlatCsv();
    if (action === 'export-markdown') return downloadMarkdown();
    if (action === 'export-developer-zip') return exportDeveloperZip();
    if (action === 'print-current') return window.print();

    const item = itemById.get(state.selectedItemId);
    if (!item) return;
    const itemRule = ensureItemRule(item);

    if (action === 'toggle-option-row') {
      const id = target.dataset.optionId;
      target.checked ? selectedRows.add(id) : selectedRows.delete(id);
      updateRowSelectionUI();
      return;
    }
    if (action === 'toggle-all-visible' || action === 'select-all-options') {
      const ids = getCombinedOptions(item, itemRule).map(o => o.optionId);
      const allSelected = ids.every(id => selectedRows.has(id));
      ids.forEach(id => allSelected ? selectedRows.delete(id) : selectedRows.add(id));
      renderMain();
      renderStickyNav();
      return;
    }
    if (action === 'bulk-preset') return applyBulkPreset(target.dataset.preset);
    if (action === 'apply-smart-suggestions') return applySmartSuggestions(item, itemRule);
    if (action === 'add-custom-option') return addCustomOption(item, itemRule);
    if (action === 'remove-custom-option') return removeCustomOption(item, itemRule, target.dataset.optionId);
    if (action === 'remove-source-option') return removeSourceOption(item, itemRule, target.dataset.optionId);
    if (action === 'apply-label-global') return applyLabelGlobally(item, itemRule, target.dataset.optionId);
  }

  function handleChange(event) {
    const target = event.target;
    const item = itemById.get(state.selectedItemId);
    if (!item) return;

    if (target.matches('[data-item-field]')) {
      const rule = ensureItemRule(item);
      const field = target.dataset.itemField;
      const value = target.type === 'checkbox' ? target.checked : (field === 'minEvidenceCount' ? Number(target.value) : target.value);
      rule[field] = value;
      markItemDirty(item, rule);
      scheduleSave();
      renderMain();
      renderHeader();
      renderSidebar();
      renderInspector();
      renderStickyNav();
      return;
    }

    if (target.matches('[data-option-field]')) {
      const option = findOption(item, target.dataset.optionId);
      if (!option) return;
      const rule = ensureOptionRule(item, option);
      const field = target.dataset.optionField;
      rule[field] = target.type === 'checkbox' ? target.checked : target.value;
      const itemRule = ensureItemRule(item);
      markItemDirty(item, itemRule);
      scheduleSave();
      renderMain();
      renderHeader();
      renderSidebar();
      renderInspector();
      renderStickyNav();
    }
  }

  function handleInput(event) {
    const target = event.target;
    const item = itemById.get(state.selectedItemId);
    if (!item) return;

    if (target.matches('textarea[data-item-field]')) {
      const rule = ensureItemRule(item);
      rule[target.dataset.itemField] = target.value;
      markItemDirty(item, rule, false);
      scheduleSave();
      return;
    }

    if (target.matches('input[data-option-field="finalLabel"], input[data-option-field="optionNote"]')) {
      const option = findOption(item, target.dataset.optionId);
      if (!option) return;
      const rule = ensureOptionRule(item, option);
      rule[target.dataset.optionField] = target.value;
      const itemRule = ensureItemRule(item);
      markItemDirty(item, itemRule, false);
      scheduleSave();
    }
  }

  function handleKeydown(event) {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      approveCurrentAndNext();
    }
    if (event.key === 'Escape' && !dom.modalRoot.classList.contains('hidden')) closeModal();
  }

  function selectItem(itemId) {
    const item = itemById.get(itemId);
    if (!item) return;
    state.currentView = 'editor';
    state.selectedItemId = item.itemId;
    state.selectedGroupId = item.groupId;
    selectedRows.clear();
    scheduleSave();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }


  function openSummaryPage() {
    state.currentView = 'summary';
    selectedRows.clear();
    scheduleSave();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function backToEditor() {
    state.currentView = 'editor';
    scheduleSave();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function jumpToSummaryItem(itemId) {
    if (!itemById.has(itemId)) return;
    selectItem(itemId);
  }

  function navigateRelative(direction) {
    const currentIndex = allItems.findIndex(item => item.itemId === state.selectedItemId);
    const nextIndex = Math.min(allItems.length - 1, Math.max(0, currentIndex + direction));
    if (nextIndex === currentIndex) return;
    selectItem(allItems[nextIndex].itemId);
  }

  function approveCurrentAndNext() {
    const item = itemById.get(state.selectedItemId);
    if (!item) return;
    const rule = ensureItemRule(item);
    const validation = validateItem(item, rule);
    if (validation.errors.length) {
      openValidationModal(item, validation);
      return;
    }
    rule.reviewStatus = 'approved';
    rule.touched = true;
    rule.approvedAt = new Date().toISOString();
    rule.approvedBy = 'Volkan';
    state.auditLog.push({
      at: rule.approvedAt,
      action: 'ITEM_APPROVED',
      itemId: item.itemId,
      itemTitle: item.title,
      groupId: item.groupId
    });
    persistState(true);
    toast(`“${item.title}” onaylandı.`, 'ok');

    const currentIndex = allItems.findIndex(x => x.itemId === item.itemId);
    const nextPending = allItems.slice(currentIndex + 1).find(x => readItemRule(x).reviewStatus !== 'approved')
      || allItems.slice(0, currentIndex).find(x => readItemRule(x).reviewStatus !== 'approved');
    if (nextPending) selectItem(nextPending.itemId);
    else renderAll();
  }

  function revokeCurrentApproval() {
    const item = itemById.get(state.selectedItemId);
    if (!item) return;
    const rule = ensureItemRule(item);
    rule.reviewStatus = 'pending';
    rule.approvedAt = null;
    state.auditLog.push({ at: new Date().toISOString(), action: 'APPROVAL_REVOKED', itemId: item.itemId, itemTitle: item.title });
    persistState(true);
    renderAll();
    toast('Madde onayı kaldırıldı.', 'warn');
  }

  function markItemDirty(item, rule, notify = true) {
    rule.touched = true;
    if (rule.reviewStatus === 'approved') {
      rule.reviewStatus = 'pending';
      rule.approvedAt = null;
      if (notify) toast('Madde değiştirildiği için onay taslağa çevrildi.', 'warn');
    }
  }

  function itemPassesFilter(item) {
    const status = getItemStatusInfo(item);
    if (state.filter === 'approved') return status.approved;
    if (state.filter === 'pending') return !status.approved;
    if (state.filter === 'unresolved') return status.unresolved;
    return true;
  }

  function getItemStatusInfo(item) {
    const rule = readItemRule(item);
    const validation = validateItem(item, rule);
    const unresolved = validation.unresolvedLabelCount > 0;
    const approved = rule.reviewStatus === 'approved';
    if (approved) return { approved: true, unresolved, dotClass: 'approved', label: 'Onaylandı' };
    if (unresolved) return { approved: false, unresolved: true, dotClass: 'unresolved', label: 'Etiketsiz seçenek var' };
    if (rule.touched && validation.errors.length) return { approved: false, unresolved: false, dotClass: 'error', label: 'Eksik karar var' };
    return { approved: false, unresolved: false, dotClass: '', label: 'Bekliyor' };
  }

  function groupProgress(group) {
    return {
      total: group.items.length,
      approved: group.items.filter(item => readItemRule(item).reviewStatus === 'approved').length
    };
  }

  function validateItem(item, itemRule) {
    const options = getCombinedOptions(item, itemRule);
    const errors = [];
    const optionErrors = {};
    let unresolvedLabelCount = 0;
    let optionCompleteCount = 0;

    options.forEach(option => {
      const rule = readOptionRule(item, itemRule, option);
      const errs = [];
      if (!String(rule.finalLabel || '').trim()) {
        errs.push(`“${option.label || `Kod ${option.value}`}” seçeneğinin kullanıcı etiketi eksik.`);
        unresolvedLabelCount += 1;
      }
      if (!rule.severity) errs.push(`“${rule.finalLabel || option.label || option.value}” için önem kategorisi seçilmedi.`);
      if (itemRule.guaranteeRelevant && !rule.guaranteeEffect) errs.push(`“${rule.finalLabel || option.label || option.value}” için garanti etkisi seçilmedi.`);
      if (!errs.length) optionCompleteCount += 1;
      else {
        optionErrors[option.optionId] = errs;
        errors.push(...errs);
      }
    });

    if (!options.length && !String(itemRule.customRuleText || '').trim()) {
      errors.push('Kaynakta seçenek olmadığı için özel kural açıklaması yazılmalı veya özel seçenek eklenmeli.');
    }
    if (!itemRule.photoPolicy) errors.push('Fotoğraf / kanıt kuralı seçilmedi.');
    if (!itemRule.evidenceType) errors.push('Kanıt türü seçilmedi.');
    if (!itemRule.descriptionPolicy) errors.push('Açıklama kuralı seçilmedi.');
    if (Number(itemRule.minEvidenceCount) < 1 || Number(itemRule.minEvidenceCount) > 3) errors.push('Minimum kanıt adedi 1–3 arasında olmalı.');

    return { errors, optionErrors, unresolvedLabelCount, optionCompleteCount, optionCount: options.length };
  }

  function validateProject() {
    let approvedItems = 0;
    let itemsWithErrors = 0;
    let unresolvedLabels = 0;
    let missingSeverities = 0;
    let missingGuaranteeEffects = 0;
    let totalOptions = 0;
    let completeOptions = 0;

    allItems.forEach(item => {
      const itemRule = readItemRule(item);
      const validation = validateItem(item, itemRule);
      if (itemRule.reviewStatus === 'approved') approvedItems += 1;
      if (validation.errors.length) itemsWithErrors += 1;
      unresolvedLabels += validation.unresolvedLabelCount;
      totalOptions += validation.optionCount;
      completeOptions += validation.optionCompleteCount;

      const options = getCombinedOptions(item, itemRule);
      options.forEach(option => {
        const rule = readOptionRule(item, itemRule, option);
        if (!rule.severity) missingSeverities += 1;
        if (itemRule.guaranteeRelevant && !rule.guaranteeEffect) missingGuaranteeEffects += 1;
      });
    });

    return {
      totalItems: allItems.length,
      approvedItems,
      pendingItems: allItems.length - approvedItems,
      itemsWithErrors,
      unresolvedLabels,
      missingSeverities,
      missingGuaranteeEffects,
      totalOptions,
      completeOptions,
      allApproved: approvedItems === allItems.length,
      exportReady: approvedItems === allItems.length && itemsWithErrors === 0
    };
  }

  function isEvidenceRequired(itemRule, optionRule) {
    if (optionRule.manualEvidenceRequired) return true;
    if (state.settings.automaticEvidenceForCriticalAndG2G3 && (optionRule.severity === 'KRITIK' || ['G2', 'G3'].includes(optionRule.guaranteeEffect))) return true;
    if (itemRule.photoPolicy === 'F1' || itemRule.photoPolicy === 'F4') return true;
    if (itemRule.photoPolicy === 'F2' && ['KUSURLU', 'KRITIK', 'KONTROL_BEKLIYOR'].includes(optionRule.severity)) return true;
    if (itemRule.photoPolicy === 'F3' && optionRule.severity === 'KRITIK') return true;
    return false;
  }

  function isDescriptionRequired(itemRule, optionRule) {
    if (optionRule.manualDescriptionRequired) return true;
    if (state.settings.automaticDescriptionForCriticalAndG2G3 && (optionRule.severity === 'KRITIK' || ['G2', 'G3'].includes(optionRule.guaranteeEffect))) return true;
    if (itemRule.descriptionPolicy === 'D3') return true;
    if (itemRule.descriptionPolicy === 'D1' && ['KUSURLU', 'KRITIK', 'KONTROL_BEKLIYOR'].includes(optionRule.severity)) return true;
    if (itemRule.descriptionPolicy === 'D2' && (optionRule.severity === 'KRITIK' || ['G2', 'G3'].includes(optionRule.guaranteeEffect))) return true;
    return false;
  }

  function applyBulkPreset(preset) {
    const item = itemById.get(state.selectedItemId);
    if (!item) return;
    const itemRule = ensureItemRule(item);
    if (!selectedRows.size) {
      toast('Önce işlem uygulanacak seçenekleri işaretleyin.', 'warn');
      return;
    }
    const mapping = {
      positive: { severity: 'UYGUN', guaranteeEffect: 'G0', manualEvidenceRequired: false },
      declared: { severity: 'KUSURLU', guaranteeEffect: 'G1', manualEvidenceRequired: true },
      repair: { severity: 'KUSURLU', guaranteeEffect: 'G2', manualEvidenceRequired: true },
      critical: { severity: 'KRITIK', guaranteeEffect: 'G3', manualEvidenceRequired: true },
      control: { severity: 'KONTROL_BEKLIYOR', guaranteeEffect: 'G2', manualEvidenceRequired: true }
    };
    const values = mapping[preset];
    if (!values) return;
    getCombinedOptions(item, itemRule).forEach(option => {
      if (!selectedRows.has(option.optionId)) return;
      Object.assign(ensureOptionRule(item, option), values);
    });
    markItemDirty(item, itemRule);
    scheduleSave();
    renderAll();
    toast(`${selectedRows.size} seçeneğe toplu kural uygulandı.`, 'ok');
  }

  function applySmartSuggestions(item, itemRule) {
    let applied = 0;
    getCombinedOptions(item, itemRule).forEach(option => {
      const rule = ensureOptionRule(item, option);
      const label = String(rule.finalLabel || option.label || '').trim();
      if (!label) return;
      const suggestion = recommendRule(label, item.title);
      if (!suggestion) return;
      if (!rule.severity) rule.severity = suggestion.severity;
      if (!rule.guaranteeEffect && itemRule.guaranteeRelevant) rule.guaranteeEffect = suggestion.guaranteeEffect;
      if (suggestion.manualEvidenceRequired) rule.manualEvidenceRequired = true;
      applied += 1;
    });
    if (!applied) {
      toast('Etiketi belli olan seçeneklerde uygulanabilir taslak öneri bulunamadı.', 'warn');
      return;
    }
    markItemDirty(item, itemRule);
    scheduleSave();
    renderAll();
    toast(`${applied} seçeneğe metin tabanlı taslak öneri uygulandı. Onaylamadan önce kontrol edin.`, 'ok');
  }

  function recommendRule(label, itemTitle) {
    const text = normalizeText(label);
    const item = normalizeText(itemTitle);

    const controlTerms = ['bilmiyorum', 'bakilamadi', 'gorulemedi', 'kontrol ediniz', 'olculemedi', 'test yapilamadi', 'tespit edilemedi', 'bilinmiyor'];
    if (controlTerms.some(t => text.includes(t))) return { severity: 'KONTROL_BEKLIYOR', guaranteeEffect: 'G2', manualEvidenceRequired: true };

    const severeTerms = ['agir hasar', 'rehin', 'haciz', 'acil servis', 'patlak airbag', 'airbag yok', 'sasi kirik'];
    if (severeTerms.some(t => text.includes(t))) return { severity: 'KRITIK', guaranteeEffect: 'G3', manualEvidenceRequired: true };

    const positiveExact = ['iyi', 'sorunsuz', 'hasarsiz', 'uygun', 'calisiyor', 'hayir', 'yok', 'yanmiyor', 'normal', 'orijinal'];
    const positiveTerms = ['ariza kaydi yok', 'kacak yok', 'sizinti yok', 'hasar yok', 'mevcut degil', 'problem yok', 'sorun yok'];
    if (positiveExact.includes(text) || positiveTerms.some(t => text.includes(t))) return { severity: 'UYGUN', guaranteeEffect: 'G0', manualEvidenceRequired: false };

    const neutralTerms = ['kar lastigi mevcut', 'arazi tipi lastik mevcut', 'bilgi', 'not'];
    if (neutralTerms.some(t => text.includes(t))) return { severity: 'BILGI', guaranteeEffect: 'G0', manualEvidenceRequired: false };

    const negativeTerms = ['kotu', 'orta', 'kirik', 'hasar', 'deforme', 'calismiyor', 'ariza', 'kacak', 'sizinti', 'yaniyor', 'sorunlu', 'degismis', 'degistirilmis', 'boyali', 'ezik', 'cizik', 'gocuk', 'bakim gerekli', 'dusuk', 'yok'];
    if (negativeTerms.some(t => text.includes(t)) || text === 'evet' || text === 'var') {
      const guaranteeEffect = (item.includes('airbag') || item.includes('fren') || item.includes('motor') || item.includes('sanziman')) ? 'G2' : 'G1';
      return { severity: 'KUSURLU', guaranteeEffect, manualEvidenceRequired: true };
    }
    return null;
  }

  function addCustomOption(item, itemRule) {
    const seq = (itemRule.customOptions || []).length + 1;
    const optionId = `custom-${Date.now()}-${seq}`;
    itemRule.customOptions.push({ optionId, value: optionId, label: `Yeni Seçenek ${seq}` });
    itemRule.optionRules[optionId] = {
      finalLabel: `Yeni Seçenek ${seq}`,
      severity: '', guaranteeEffect: '', manualEvidenceRequired: false, manualDescriptionRequired: false, optionNote: ''
    };
    markItemDirty(item, itemRule);
    scheduleSave();
    renderAll();
    toast('Özel seçenek eklendi. Etiketini ve kurallarını düzenleyin.', 'ok');
  }

  function removeCustomOption(item, itemRule, optionId) {
    itemRule.customOptions = itemRule.customOptions.filter(o => o.optionId !== optionId);
    delete itemRule.optionRules[optionId];
    selectedRows.delete(optionId);
    markItemDirty(item, itemRule);
    scheduleSave();
    renderAll();
    toast('Özel seçenek silindi.', 'warn');
  }

  function removeSourceOption(item, itemRule, optionId) {
    const option = item.options.find(o => o.optionId === optionId);
    if (!option) return;
    itemRule.removedOptionIds = Array.isArray(itemRule.removedOptionIds) ? itemRule.removedOptionIds : [];
    if (!itemRule.removedOptionIds.includes(optionId)) itemRule.removedOptionIds.push(optionId);
    delete itemRule.optionRules[optionId];
    selectedRows.delete(optionId);
    markItemDirty(item, itemRule);
    scheduleSave();
    renderAll();
    toast(`Kod ${option.value} bu maddeden kaldırıldı.`, 'warn');
  }

  function applyLabelGlobally(item, itemRule, optionId) {
    const option = findOption(item, optionId);
    if (!option || !option.unknown) return;
    const optionRule = ensureOptionRule(item, option);
    const label = String(optionRule.finalLabel || '').trim();
    if (!label) {
      toast('Önce seçenek etiketini yazın.', 'warn');
      return;
    }
    const code = String(option.value);
    state.globalLabelOverrides[code] = label;
    let count = 0;
    (unknownCodeUsage.get(code) || []).forEach(ref => {
      const refItem = itemById.get(ref.itemId);
      const refOption = refItem?.options.find(o => o.optionId === ref.optionId);
      if (!refItem || !refOption) return;
      const refRule = ensureOptionRule(refItem, refOption);
      refRule.finalLabel = label;
      count += 1;
    });
    markItemDirty(item, itemRule);
    scheduleSave();
    renderAll();
    toast(`“${label}” etiketi aynı kodun ${count} kullanımına uygulandı.`, 'ok');
  }

  function findOption(item, optionId) {
    const itemRule = ensureItemRule(item);
    return getCombinedOptions(item, itemRule).find(o => o.optionId === optionId);
  }

      },

  function buildExportItem(item) {
    const rule = readItemRule(item);
    const validation = validateItem(item, rule);
    const options = getCombinedOptions(item, rule);
    return {
      globalIndex: item.globalIndex,
      itemNo: item.itemNo,
      itemId: item.itemId,
      noktaId: item.noktaId,
      title: item.title,
      reviewStatus: rule.reviewStatus,
      approvedAt: rule.approvedAt,
      approvedBy: rule.approvedBy,
      guaranteeRelevant: rule.guaranteeRelevant,
      evidenceRule: {
        photoPolicy: rule.photoPolicy,
        photoPolicyLabel: DEFINITIONS.photoPolicies[rule.photoPolicy] || rule.photoPolicy,
        evidenceType: rule.evidenceType,
        evidenceTypeLabel: DEFINITIONS.evidenceTypes[rule.evidenceType] || rule.evidenceType,
        minimumCount: Number(rule.minEvidenceCount || 1),
        sourcePhotoSlots: item.sourcePhotoSlots
      },
      descriptionRule: {
        policy: rule.descriptionPolicy,
        policyLabel: DEFINITIONS.descriptionPolicies[rule.descriptionPolicy] || rule.descriptionPolicy
      },
      measurementRule: {
        required: Boolean(rule.measurementRequired),
        sourceInputs: item.inputs
      },
      customRuleText: rule.customRuleText || '',
      itemNote: rule.itemNote || '',
      validation: {
        valid: validation.errors.length === 0,
        errors: validation.errors
      },
      options: options.map(option => {
        const optionRule = readOptionRule(item, rule, option);
        return {
          optionId: option.optionId,
          sourceType: option.optionType,
          sourceValue: option.value,
          sourceLabel: option.label,
          sourceNeedsLabelMap: Boolean(option.unknown),
          customOption: Boolean(option.custom),
          finalLabel: optionRule.finalLabel || '',
          severity: optionRule.severity || null,
          severityLabel: DEFINITIONS.severities[optionRule.severity] || null,
          critical: optionRule.severity === 'KRITIK',
          guaranteeEffect: rule.guaranteeRelevant ? (optionRule.guaranteeEffect || null) : 'NOT_APPLICABLE',
          guaranteeEffectLabel: rule.guaranteeRelevant ? (DEFINITIONS.guaranteeEffects[optionRule.guaranteeEffect] || null) : 'Garanti değerlendirmesine dahil değil',
          manualEvidenceRequired: Boolean(optionRule.manualEvidenceRequired),
          effectiveEvidenceRequired: isEvidenceRequired(rule, optionRule),
          effectiveEvidenceType: rule.evidenceType,
          minimumEvidenceCount: isEvidenceRequired(rule, optionRule) ? Number(rule.minEvidenceCount || 1) : 0,
          manualDescriptionRequired: Boolean(optionRule.manualDescriptionRequired),
          effectiveDescriptionRequired: isDescriptionRequired(rule, optionRule),
          optionNote: optionRule.optionNote || ''
        };
      })
    };
  }

  function buildFlatRows() {
    const rows = [];
    groups.forEach(group => group.items.forEach(item => {
      const rule = readItemRule(item);
      const options = getCombinedOptions(item, rule);
      if (!options.length) {
        rows.push(flatRow(group, item, rule, null, null));
      } else {
        options.forEach(option => rows.push(flatRow(group, item, rule, option, readOptionRule(item, rule, option))));
      }
    }));
    return rows;
  }

  function flatRow(group, item, rule, option, optionRule) {
    return {
      groupNo: group.groupNo,
      groupId: group.groupId,
      groupTitle: group.title,
      moduleTitle: group.moduleTitle,
      itemGlobalIndex: item.globalIndex,
      itemNo: item.itemNo,
      itemId: item.itemId,
      noktaId: item.noktaId,
      itemTitle: item.title,
      reviewStatus: rule.reviewStatus,
      guaranteeRelevant: rule.guaranteeRelevant,
      photoPolicy: rule.photoPolicy,
      evidenceType: rule.evidenceType,
      minimumEvidenceCount: rule.minEvidenceCount,
      descriptionPolicy: rule.descriptionPolicy,
      measurementRequired: rule.measurementRequired,
      customRuleText: rule.customRuleText || '',
      itemNote: rule.itemNote || '',
      optionId: option?.optionId || '',
      sourceValue: option?.value || '',
      sourceLabel: option?.label || '',
      finalLabel: optionRule?.finalLabel || '',
      severity: optionRule?.severity || '',
      critical: optionRule?.severity === 'KRITIK',
      guaranteeEffect: rule.guaranteeRelevant ? (optionRule?.guaranteeEffect || '') : 'NOT_APPLICABLE',
      evidenceRequired: optionRule ? isEvidenceRequired(rule, optionRule) : '',
      descriptionRequired: optionRule ? isDescriptionRequired(rule, optionRule) : '',
      optionNote: optionRule?.optionNote || ''
    };
  }

      '- **G2:** Düzeltme, onarım veya tekrar kontrol sonrası.',

        lines.push(`### ${item.globalIndex}. ${item.title}`);
        lines.push(`- Nokta ID: \`${item.noktaId}\``);
        lines.push(`- Durum: **${item.reviewStatus}**`);
        lines.push(`- Fotoğraf/kanıt: **${item.evidenceRule.photoPolicy} — ${item.evidenceRule.photoPolicyLabel}**, ${item.evidenceRule.evidenceTypeLabel}, en az ${item.evidenceRule.minimumCount}`);
        lines.push(`- Açıklama: **${item.descriptionRule.policy} — ${item.descriptionRule.policyLabel}**`);
        lines.push(`- Garanti değerlendirmesi: **${item.guaranteeRelevant ? 'Dahil' : 'Hariç'}**`);
        if (item.customRuleText) lines.push(`- Özel kural: ${item.customRuleText}`);
        if (item.itemNote) lines.push(`- Not: ${item.itemNote}`);
        lines.push('');
        if (item.options.length) {
          lines.push('| Seçenek | Kategori | Kritik | Garanti | Kanıt | Açıklama |');
          lines.push('|---|---|:---:|---|:---:|:---:|');
          item.options.forEach(opt => {
            lines.push(`| ${mdCell(opt.finalLabel || `Kod ${opt.sourceValue}`)} | ${mdCell(opt.severityLabel || 'Eksik')} | ${opt.critical ? 'Evet' : 'Hayır'} | ${mdCell(opt.guaranteeEffectLabel || 'Eksik')} | ${opt.effectiveEvidenceRequired ? 'Zorunlu' : 'Opsiyonel'} | ${opt.effectiveDescriptionRequired ? 'Zorunlu' : 'Opsiyonel'} |`);
          });
          lines.push('');
        }
      });
    });
    return lines.join('\n');
  }

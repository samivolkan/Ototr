<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTOTR - Profesyonel Ekspertiz Sunumu</title>
  <link rel="stylesheet" href="kaporta-360/fonts/fonts.css">
  <style>
    :root {
      --navy: #101f3d;
      --navy-2: #0b1427;
      --red: #d71920;
      --red-soft: #fff1f2;
      --green: #159447;
      --green-soft: #eefaf3;
      --amber: #f59e0b;
      --amber-soft: #fff8eb;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --ink: #101828;
      --muted: #667085;
      --line: #dfe5ec;
      --line-2: #edf1f5;
      --bg: #f3f5f8;
      --panel: #ffffff;
      --shadow: 0 18px 44px rgba(16, 31, 61, .10);
      --radius: 12px;
      --radius-sm: 8px;
      --max: 100%;
      --nav-width: 308px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: Inter, Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(16,31,61,.04), rgba(16,31,61,0) 260px),
        var(--bg);
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app-shell {
      min-height: 100vh;
      padding-top: 74px;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      min-height: 74px;
      background: linear-gradient(90deg, var(--navy), #14294e);
      color: #fff;
      border-bottom: 4px solid var(--red);
      box-shadow: 0 12px 28px rgba(16,31,61,.24);
    }

    .topbar-inner {
      max-width: var(--max);
      width: 100%;
      margin: 0 auto;
      min-height: 70px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto;
      align-items: center;
      gap: 22px;
      padding: 12px 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      grid-template-columns: 58px 44px;
      align-items: stretch;
      height: 36px;
      transform: skewX(-8deg);
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.20));
    }

    .brand-mark span {
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: .02em;
      transform: skewX(8deg);
    }

    .brand-mark span:first-child {
      color: var(--navy-2);
      background: #fff;
    }

    .brand-mark span:last-child {
      color: #fff;
      background: var(--red);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-copy small {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-metas {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
    }

    .top-meta {
      min-width: 94px;
      text-align: right;
    }

    .top-meta span {
      display: block;
      color: rgba(255,255,255,.58);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
    }

    .top-meta b {
      display: block;
      margin-top: 5px;
      font-size: 14px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .tool-button {
      border: 1px solid rgba(255,255,255,.18);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,.10);
      color: #fff;
      min-height: 38px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    .tool-button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.16);
    }

    .tool-button.primary {
      border-color: var(--red);
      background: var(--red);
    }

    .layout {
      max-width: none;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--nav-width);
      gap: 18px;
      padding: 18px 20px 46px 28px;
    }

    .sidebar {
      order: 2;
      position: sticky;
      top: 92px;
      align-self: start;
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 110px);
      overflow: auto;
      padding: 2px 0 2px 4px;
      scrollbar-width: thin;
    }

    .nav-card {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(16,31,61,.05);
      color: #344054;
      cursor: pointer;
      text-align: left;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }

    .nav-card:hover {
      transform: translateY(-1px);
      border-color: rgba(215,25,32,.35);
    }

    .nav-card.is-active {
      background: var(--red-soft);
      border-color: var(--red);
      color: var(--red);
    }

    .nav-index {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f1f4f8;
      color: #7b8794;
      font-size: 12px;
      font-weight: 900;
    }

    .nav-card.is-active .nav-index {
      background: var(--red);
      color: #fff;
    }

    .nav-title {
      min-width: 0;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.18;
      text-transform: uppercase;
    }

    .nav-state {
      border-radius: 999px;
      padding: 5px 8px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .content {
      order: 1;
      display: grid;
      gap: 18px;
      min-width: 0;
      width: 100%;
    }

    .slide {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(16,31,61,.035) 0 1px, transparent 1px 20px),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .test-slide {
      scroll-margin-top: 96px;
    }

    .test-slide .slide-inner {
      min-height: calc(100vh - 136px);
      display: grid;
      align-content: start;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--red), #2f65f5, #18a558);
    }

    .slide-inner {
      position: relative;
      padding: 30px 34px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 22px;
      min-height: 430px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--red);
      font-size: 12px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(215,25,32,.12);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      max-width: 880px;
      font-size: clamp(34px, 5vw, 68px);
      line-height: .98;
      letter-spacing: 0;
      color: var(--navy-2);
    }

    .lead {
      max-width: 760px;
      margin-top: 16px;
      color: #475467;
      font-size: 18px;
      line-height: 1.62;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: #344054;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .pill.good {
      background: var(--green-soft);
      border-color: rgba(21,148,71,.25);
      color: #087236;
    }

    .pill.warn {
      background: var(--amber-soft);
      border-color: rgba(245,158,11,.30);
      color: #9a5b00;
    }

    .hero-panel {
      display: grid;
      gap: 14px;
      align-content: start;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff, #f8fafc);
      border: 1px solid var(--line);
      box-shadow: 0 14px 30px rgba(16,31,61,.08);
    }

    .plate {
      display: grid;
      grid-template-columns: 70px 1fr;
      min-height: 74px;
      overflow: hidden;
      border: 3px solid #263449;
      border-radius: 9px;
      background: #fff;
      color: var(--navy-2);
      box-shadow: inset 0 0 0 1px rgba(16,31,61,.06);
    }

    .plate span {
      display: grid;
      place-items: center;
      background: #1d4ed8;
      color: #fff;
      font-weight: 950;
      font-size: 22px;
    }

    .plate b {
      display: grid;
      place-items: center;
      font-size: 34px;
      line-height: 1;
      letter-spacing: .02em;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line-2);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      min-height: 86px;
    }

    .metric span {
      display: block;
      color: #7b8794;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .metric b {
      display: block;
      margin-top: 8px;
      color: var(--navy-2);
      font-size: 18px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 18px;
    }

    .section-head h2 {
      color: var(--navy-2);
      font-size: clamp(24px, 2.6vw, 36px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .section-head p {
      max-width: 780px;
      margin-top: 8px;
      color: #667085;
      font-size: 14px;
      line-height: 1.55;
    }

    .slide-no {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      font-weight: 950;
    }

    .summary-grid,
    .cards-3,
    .cards-4 {
      display: grid;
      gap: 14px;
    }

    .summary-grid {
      grid-template-columns: 1.1fr .9fr;
    }

    .cards-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .cards-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .selection-grid {
      display: grid;
      grid-template-columns: 1.15fr .95fr .9fr;
      gap: 14px;
      margin: 16px 0 4px;
    }

    .overview-item {
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 14px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .overview-item b {
      color: var(--navy-2);
      font-size: 13px;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .overview-item span {
      color: #667085;
      font-size: 12px;
      line-height: 1.35;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 16px;
      min-width: 0;
    }

    .card.soft {
      background: linear-gradient(180deg, #fff, #f9fbfd);
    }

    .card h3 {
      margin-bottom: 10px;
      color: var(--navy-2);
      font-size: 15px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .card p {
      color: #667085;
      font-size: 13px;
      line-height: 1.55;
    }

    .decision {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      border-color: rgba(21,148,71,.22);
      background: linear-gradient(180deg, #fff, var(--green-soft));
    }

    .decision-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #fff;
      font-size: 26px;
      font-weight: 950;
      box-shadow: 0 0 0 8px rgba(21,148,71,.10);
    }

    .decision strong {
      display: block;
      color: #087236;
      font-size: 22px;
      line-height: 1.1;
    }

    .decision span {
      display: block;
      margin-top: 6px;
      color: #44604f;
      font-size: 13px;
      line-height: 1.45;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .stat {
      min-height: 86px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
    }

    .stat span {
      display: block;
      color: #7b8794;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .stat b {
      display: block;
      margin-top: 8px;
      color: var(--navy-2);
      font-size: 28px;
      line-height: 1;
    }

    .alert-list {
      display: grid;
      gap: 10px;
    }

    .alert {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid rgba(245,158,11,.28);
      border-radius: 10px;
      background: var(--amber-soft);
    }

    .alert::before {
      content: "";
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--amber);
    }

    .alert strong {
      display: block;
      color: #8a5300;
      font-size: 13px;
      line-height: 1.25;
    }

    .alert span {
      display: block;
      margin-top: 4px;
      color: #7a5a18;
      font-size: 12px;
      line-height: 1.45;
    }

    .module {
      border-top: 1px solid var(--line-2);
      padding-top: 18px;
      margin-top: 16px;
    }

    .module-page {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .module:first-of-type {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .module-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      margin-bottom: 14px;
    }

    .module-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .module-title .number {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--red);
      color: #fff;
      font-weight: 950;
      font-size: 13px;
    }

    .module-title h3 {
      color: var(--navy-2);
      font-size: 20px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .module-desc {
      margin: 7px 0 0 44px;
      max-width: 860px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: #087236;
      font-size: 11px;
      font-weight: 950;
      white-space: nowrap;
    }

    .status-badge.warn {
      background: var(--amber-soft);
      color: #9a5b00;
    }

    .status-badge.neutral {
      background: #eef2f7;
      color: #475467;
    }

    .module-body {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 14px;
    }

    .test-story-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(260px, .78fr) 340px;
      gap: 14px;
      margin-bottom: 16px;
    }

    .story-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #fff, #f9fbfd);
      padding: 16px;
      min-width: 0;
    }

    .story-card.highlight {
      border-color: rgba(37,99,235,.25);
      background: linear-gradient(180deg, #fff, var(--blue-soft));
    }

    .story-card.accent {
      border-color: rgba(215,25,32,.20);
      background: linear-gradient(180deg, #fff, #fff5f5);
    }

    .story-card h3 {
      margin-bottom: 10px;
      color: var(--navy-2);
      font-size: 14px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .story-card p {
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }

    .story-card p + p {
      margin-top: 10px;
    }

    .story-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .story-list li {
      position: relative;
      padding-left: 18px;
      color: #475467;
      font-size: 13px;
      line-height: 1.45;
    }

    .story-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .55em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
    }

    .scope-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .scope-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 38px;
      padding: 9px 10px;
      border-radius: 9px;
      background: #fff;
      border: 1px solid var(--line-2);
      color: #344054;
      font-size: 12px;
      line-height: 1.25;
    }

    .scope-list b {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .scope-list span {
      border-radius: 999px;
      background: #eef2f7;
      color: #475467;
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 950;
      white-space: nowrap;
    }

    .test-detail-area {
      display: grid;
      gap: 14px;
      align-items: start;
    }

    .test-detail-area.has-image {
      grid-template-columns: 360px minmax(0, 1fr);
    }

    .result-card {
      display: grid;
      gap: 12px;
      align-content: start;
      border: 1px solid rgba(21,148,71,.22);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #fff, #f8fffb);
      padding: 16px;
    }

    .result-card.warn {
      border-color: rgba(245,158,11,.32);
      background: linear-gradient(180deg, #fff, var(--amber-soft));
    }

    .result-card strong {
      color: var(--navy-2);
      font-size: 18px;
      line-height: 1.15;
    }

    .result-card p {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mini {
      border: 1px solid var(--line-2);
      border-radius: 9px;
      background: #fff;
      padding: 10px;
    }

    .mini span {
      display: block;
      color: #7b8794;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .mini b {
      display: block;
      margin-top: 6px;
      color: var(--navy-2);
      font-size: 18px;
      line-height: 1.1;
    }

    .detail-grid {
      display: grid;
      gap: 10px;
    }

    .detail-section {
      border: 1px solid var(--line-2);
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
    }

    .detail-section summary {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      color: var(--navy-2);
      font-size: 13px;

      }

      .damage-card {

      }

        text-align: left;
        border-left: 0;

      }

    @media (max-width: 760px) {
      .topbar-inner,
      .layout {
        padding-left: 14px;
        padding-right: 14px;
      }

      .app-shell {
        padding-top: 190px;
      }

      .top-metas {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
      }

      .top-meta {
        text-align: left;
        min-width: 0;
      }

      .sidebar {
        top: 190px;
      }

      .test-slide {
        scroll-margin-top: 276px;
      }

      .slide-inner {
        padding: 18px;
      }

      h1 {
        font-size: 38px;
      }

      .lead {
        font-size: 15px;
      }

      .section-head,
      .module-top {
        grid-template-columns: 1fr;
      }

      .cards-3,
      .cards-4,
      .overview-grid,
      .stat-row,
      .metric-grid,
      .mini-stats,
      .proof-grid,
      .legend,
      .system-mini-grid,
      .tramer-metric-board,
      .history-grid,
      .source-preview-grid {
        grid-template-columns: 1fr;
      }

      .system-visual-head {
        align-items: start;
        flex-direction: column;
      }

      .system-stage {
        min-height: 280px;
      }

      .visual-hotspot {
        max-width: 66%;
        font-size: 10px;
      }

      .tramer-hero-main {
        padding: 22px;
        min-height: auto;
      }

      .tramer-headline {
        font-size: 34px;
      }

      .tramer-metric-card b {
        overflow-wrap: anywhere;
      }

      .tramer-doc-card img {
        height: 300px;
      }

      .damage-card {
        grid-template-columns: 1fr;
      }

      .damage-year,
      .damage-amount {
        border: 0;
        padding: 0;
      }

      .module-desc {
        margin-left: 0;
      }

      .plate {
        grid-template-columns: 58px 1fr;
      }

      .plate b {
        font-size: 26px;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      body {
        background: #fff;
      }

      .topbar,
      .sidebar,
      .footer .screen-only,
      .tool-button {
        display: none !important;
      }

      .app-shell {
        padding-top: 0;
      }

      .layout {
        display: block;
        padding: 0;
      }

      .content {
        gap: 0;
      }

      .slide {
        break-inside: avoid;
        page-break-inside: avoid;
        box-shadow: none;
        border-color: #ccd4df;
        margin-bottom: 10mm;
      }

      .slide-inner {
        padding: 14mm;
      }

      .detail-section {
        break-inside: avoid;
      }

      details:not([open]) > *:not(summary) {
        display: block;
      }
    }
  </style>

    const groupByTitle = (module, title) => (module.groups || []).find((group) => group.title === title) || { rows: [] };

    const rowValue = (group, label, fallback = "-") => {

    const splitParts = (value) => String(value || "")

    const resultCard = (module, tone) => `

    function renderTopbar() {

      topMetas.innerHTML = [

        ["Araç", meta.vehicle],
        ["Paket", meta.package]
      ].map(([label, value]) => `<div class="top-meta"><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`).join("");
    }

      const navItems = [
        { id: "kapak", title: "Karar Özeti", status: "Sunum" },
        ...reportData.modules.map((module, index) => ({ id: module.id, title: module.title, status: module.status, index: index + 1 })),
        { id: "kanit", title: "Kanıtlar / Notlar", status: "Arşiv" }
      ];
      sidebar.innerHTML = navItems.map((item, i) => `
        <a class="nav-card ${i === 0 ? "is-active" : ""}" href="#${escapeHtml(item.id)}">
          <span class="nav-index">${String(item.index || 0).padStart(2, "0")}</span>
          <span class="nav-title">${escapeHtml(item.title)}</span>
          <span class="nav-state">${escapeHtml(item.status)}</span>

                <p>Canlı sayfadaki teknik tablo yapısı korunur; müşteri sunumunda önce genel karar, sonra takip gerektiren alanlar ve ardından detay modülleri gösterilir.</p>
              </div>

    function bindInteractions() {
      const modeToggle = document.getElementById("modeToggle");
      modeToggle.addEventListener("click", () => {
        document.body.classList.toggle("customer-mode");
        modeToggle.textContent = document.body.classList.contains("customer-mode") ? "Teknik Mod" : "Müşteri Modu";
      });

      const links = Array.from(document.querySelectorAll(".nav-card"));
      const sections = links.map((link) => document.querySelector(link.getAttribute("href"))).filter(Boolean);
      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        links.forEach((link) => link.classList.toggle("is-active", link.getAttribute("href") === `#${visible.target.id}`));
      }, { rootMargin: "-35% 0px -55% 0px", threshold: [0, .25, .5, .75] });
      sections.forEach((section) => observer.observe(section));
    }

    function scrollToCurrentHash() {
      if (!window.location.hash) return;
      const targetId = decodeURIComponent(window.location.hash.slice(1));
      const target = document.getElementById(targetId);
      if (!target) return;
      const scroll = () => {
        const headerOffset = window.innerWidth <= 760 ? 88 : 96;
        const top = Math.max(0, target.getBoundingClientRect().top + window.scrollY - headerOffset);
        window.scrollTo({ top, behavior: "auto" });
      };
      requestAnimationFrame(scroll);
      window.setTimeout(scroll, 80);
      window.setTimeout(scroll, 350);
    }

    renderTopbar();
    renderSidebar();
    renderContent();
    bindInteractions();
    window.addEventListener("hashchange", scrollToCurrentHash);
    window.addEventListener("load", scrollToCurrentHash);
    window.scrollToCurrentHash = scrollToCurrentHash;
    scrollToCurrentHash();
    window.setTimeout(scrollToCurrentHash, 900);
    window.setTimeout(scrollToCurrentHash, 1400);
  </script>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTOTR Bayi Portalı</title>
  <link rel="icon" type="image/svg+xml" href="../docs/ototr-favicon.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    iframe{width:100%;height:100%;border:0;display:block;background:#eef1f5}
  </style>
</head>
<body>
  <iframe id="dealerFrame" title="OTOTR Bayi Portalı" src="../index.html?portal=dealer#dealer"></iframe>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      params.set('portal','dealer');
      const hash = window.location.hash || '#dealer';
      document.getElementById('dealerFrame').src = `../index.html?${params.toString()}${hash}`;
    })();
  </script>
</body>
</html>

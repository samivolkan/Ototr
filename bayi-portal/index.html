<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTOTR Bayi Portali</title>
  <link rel="icon" type="image/svg+xml" href="../docs/ototr-favicon.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#eef1f5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    body{display:grid;place-items:center;color:#111827}
    p{max-width:460px;margin:0;padding:24px;text-align:center;line-height:1.5}
    a{color:#d71920;font-weight:800}
  </style>
</head>
<body>
  <p>OTOTR Bayi Portali aciliyor. Acilmazsa <a id="dealerLink" href="../index.html?portal=dealer&version=v4#dealer">buradan devam edin</a>.</p>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      params.set('portal','dealer');
      ['email','password','passwd','token','access_token','refresh_token'].forEach(function(key){ params.delete(key); });
      const hash = window.location.hash || '#dealer';
      if (!params.get('version')) {
        params.set('version', 'v4');
      }
      const target = '../index.html?' + params.toString() + hash;
      document.getElementById('dealerLink').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>

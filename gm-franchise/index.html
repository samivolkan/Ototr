function todo(){

    if(c.stage<0||!vis(c))return;

    if(s==0&&r==="fd")P("Görüşme planla"+(c.slaGun>c.sla?" ⚠ SLA":""));
    if(s==1&&r==="fd")P("Görüşme formunu tamamla ve skorla");
    if(s==2){const i=AP.findIndex((_,index)=>!c.a.includes(index));if(i>=0&&AP[i][1]==r)P("Onay: "+AP[i][0])}
    if(s==3){if(nB(c)<BDOC.length&&["fd","hk"].includes(r))P("Belge eksik ("+nB(c)+"/"+BDOC.length+")");if(!c.signed&&r=="hk")P("E-imza doğrula");if(!c.paid&&r=="fn")P("İlk ödeme tahsil et")}
    if(s==4)TL.filter(x=>!c.t[x.k]&&x.r==r).forEach(x=>P(x.u+": "+x.t));
    if(s==5){SU.forEach((x,i)=>{if(!c.s[i]&&x[1]==r)P("Kurulum: "+x[0])});if(!gate(c)&&r=="fd")P("Şubeyi aktifleştir")}

      if(c.fes)KF.forEach((x,i)=>{if(!c.kf[i]&&x[1]==r)P("Kapanış: "+x[0])});

  });

function own(c){

  if(s==3){if(nB(c)<BDOC.length)add("hk","Belge ("+nB(c)+"/"+BDOC.length+")");if(!c.signed)add("hk","E-imza");if(!c.paid)add("fn","İlk ödeme")}

  return m;
}

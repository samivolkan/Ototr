const SU=[["Hesap planı ve cari kartı kuruldu","fn"],["Web sayfası yayında (ototr.com/slug)","bt"],["Google işletme profili bağlandı","bt"],["Google yorum takibi kaydı yapıldı","bt"],["Terminal PWA girişi ve test tamam","bt"],["Kalibrasyon kayıtları girildi","sa"],["İlk 30 gün izleme planı başlatıldı","fd"]];
const KF=[["Cari bakiye sıfırlandı / tahsil edildi","fn"],["Tüm cihazlar iade alındı","sa"],["Kullanıcı erişimleri kapatıldı","bt"],["Bayi defteri kapatıldı ve arşivlendi","fn"],["Web sayfası ve Google profili kapatıldı","bt"],["Rekabet yasağı tebligatı gönderildi","hk"]];
const RJ=["Finansal yetersizlik","Bölge çakışması","Referans olumsuz","Aday vazgeçti","Kurul kararı","SLA ihlali"];
const PKT=[{ad:"Standart Ekspertiz",fiyat:2500,grup:"Bireysel"},{ad:"Kapsamlı Ekspertiz",fiyat:3500,grup:"Bireysel"},{ad:"Galeri Paketi 5 Rapor",fiyat:12500,grup:"Galeri"},{ad:"Galeri Paketi 10 Rapor",fiyat:23000,grup:"Galeri"},{ad:"Premium Fleet Aylık",fiyat:35000,grup:"Filo"}];
const BOLGELER={Kadikoy:"Anadolu",Cankaya:"IC Anadolu",Bornova:"Ege",Nilufer:"Marmara",Muratpasa:"Akdeniz",Selcuklu:"IC Anadolu",Osmangazi:"Marmara",Yesilurt:"Karadeniz",Tepebasi:"Marmara"};
const NAV=[
["","E2E","UÇTAN UCA MERKEZ"],["e2e","E2E","Yaşam döngüsü",1],["departman","E2E","Departman kapıları",1],["acilis","E2E","Açılış kurulu",1],["portallar","E2E","Dış kullanıcı portalları",1],
["","YON","YÖNETİM"],["dash","YON","Dashboard",1],["hat","YON","Süreç hattı",1],["inbox","YON","Görev merkezi",1],
["","ADY","ADAYLAR"],["pipe","ADY","Aday hattı",1],["gor","ADY","Görüşme ve değerlendirme",1],["belge","ADY","Belge yönetimi",1],
["","SUB","AKTİF ŞUBELER"],["sube","SUB","Şubeler ve sözleşme",1],["web","SUB","Web ve Google yorum",1],["paket","SUB","Paket ve fiyatlama",1],
["","FIN","FİNANS"],["fin","FIN","Royalty ve cari",1],["rapor","FIN","Raporlama ve analitik",1],
["","SYS","SİSTEM"],["yetki","SYS","Yetki matrisi",0],["denetim","SYS","Denetim kaydı",0],["model","SYS","Veri modeli",0]
];
const PERM={
gm:"e2e departman acilis portallar dash hat inbox pipe gor belge sube web paket fin rapor yetki denetim model",
fd:"e2e departman acilis portallar dash hat inbox pipe gor belge sube web paket fin rapor yetki denetim model",
fu:"e2e departman portallar dash hat inbox pipe gor belge",
hk:"e2e departman acilis dash hat inbox pipe gor belge sube",
fn:"e2e departman acilis dash hat inbox pipe fin rapor sube",
ik:"e2e departman acilis dash hat inbox pipe gor belge",
ak:"e2e departman acilis dash hat inbox pipe gor",
sa:"e2e departman acilis dash hat inbox pipe sube",
bt:"e2e departman acilis dash hat inbox pipe sube web",
ba:"portallar sube fin web",
dn:"portallar departman acilis",
td:"portallar",
ad:"portallar",
op:"e2e departman acilis hat inbox sube",
pz:"e2e departman acilis",
kl:"e2e departman acilis",
isg:"e2e departman acilis",
mm:"e2e departman acilis"
};
const $=id=>document.getElementById(id),R=()=>$("role").value;
const H=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TRL=n=>Math.round(n).toLocaleString("tr-TR")+" ₺";
const SL=s=>s.toLocaleLowerCase("tr").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const DL=()=>"04 Kas 2026";
const PC=d=>`<span class="pi ${d=="Aktif"?"ok":d=="Kapalı"?"rd":"wn"}">${d}</span>`;
let UID=1,LOG=[],FB=1,CUR="e2e",SEL=null,HF="all",DTAB="bekliyor";
function mkC(ad,ilce,yat,stage,o={}){
  const slugIlce=SL(ilce);
  const c={id:UID++,ad,ilce,bolge:BOLGELER[slugIlce]||"Diğer",yat,kaynak:"Web",stage,
    sc:[70,70,70,70],gf:{},a:[],t:{},s:{},belge:{},
    signed:0,paid:0,slug:"",roy:8,giris:250000,r:0,ucret:0,
    durum:"Aktif",bit:"",led:[],kf:{},fes:0,hist:[],rj:"",sla:3,slaGun:0,wl:0,indirim:0,gnot:""};
  if(stage>1){GF.forEach((_,i)=>c.gf[i]=1);BDOC.forEach((_,i)=>c.belge[i]=1)}
  if(stage>2)c.a=[0,1,2,3,4];
  if(stage>3){c.signed=1;c.paid=1}
  if(stage>4)TL.forEach(x=>c.t[x.k]=1);
  if(stage>5){SU.forEach((_,i)=>c.s[i]=1);c.slug=SL(ad);c.bit="2031-11-04"}
  return Object.assign(c,o);
}
let C=[
  mkC("Kadıköy Oto Ekspertiz","Kadikoy","6.000.000 ₺",6,{r:140,ucret:3200,bit:"2027-02-10",kaynak:"Referans",indirim:5}),
  mkC("Çankaya Garaj A.Ş.","Cankaya","4.500.000 ₺",6,{r:95,ucret:2900,kaynak:"Google Ads"}),
  mkC("Bornova Araç Merkezi","Bornova","3.800.000 ₺",6,{r:60,ucret:2700,roy:7}),
  mkC("Nilüfer Motors","Nilufer","3.000.000 ₺",5,{kaynak:"Fuar"}),
  mkC("Muratpaşa Ekspertiz","Muratpasa","4.000.000 ₺",4,{t:{"IK|0":1,"Finans|0":1}}),
  mkC("Selçuklu Oto Grup","Selcuklu","2.500.000 ₺",3,{signed:1}),
  mkC("Osmangazi Araç","Osmangazi","3.200.000 ₺",2,{a:[0,1]}),
  mkC("Yeşilyurt Otomotiv","Yesilurt","2.000.000 ₺",1,{kaynak:"Google Ads",sc:[80,65,70,60]}),
  mkC("Tepebaşı Garaj","Tepebasi","1.500.000 ₺",0,{slaGun:4})
];
const roy=c=>Math.round(c.r*c.ucret*c.roy/100);
const bak=c=>c.led.reduce((s,x)=>s+(x.tip=="T"?x.tt:-x.tt),0);
const gec=c=>{if(bak(c)<=0)return 0;const days=c.led.filter(x=>x.tip=="T").map(x=>Math.round((TODAY-new Date(x.vd))/864e5));return Math.max(0,...days)};
const tah=(c,dn,vd)=>({tip:"T",dn,vd,tt:roy(c)});
{const[k,ç,b]=C;
 k.led=[tah(k,"2026-10","2026-11-10")];
 ç.led=[tah(ç,"2026-10","2026-11-10"),{tip:"O",dn:"2026-10",vd:"",tt:roy(ç)}];
 b.led=[tah(b,"2026-09","2026-10-10"),tah(b,"2026-10","2026-11-10")];
}
const scr=c=>Math.round(c.sc.reduce((s,v,i)=>s+v*CR[i][1],0));
const nT=c=>Object.keys(c.t).length;
const nB=c=>Object.keys(c.belge).length;

const gC=id=>C.find(x=>x.id==id);
const adv=c=>["gm","fd"].includes(R())||(c.stage<2&&R()=="fu");
const okR=ro=>R()==ro||R()=="gm";
const LOG_ADD=(t,c)=>{LOG.unshift(DL()+" · "+RN[R()]+" · "+t);LOG.length=Math.min(LOG.length,60);if(c)c.hist.unshift(DL()+" · "+RN[R()]+" · "+t)};
function gate(c){
  const s=c.stage;
  if(s==1&&scr(c)<60)return"Ağırlıklı skor en az 60 olmalı (şu an: "+scr(c)+")";
  if(s==1&&GF.some((_,i)=>!c.gf[i]))return"Görüşme formu eksik maddeler içeriyor";
  if(s==2&&c.a.length<5)return"5 adımlı onay zinciri tamamlanmalı ("+c.a.length+"/5)";
  if(s==3&&nB(c)<BDOC.length)return"Tüm belgeler tamamlanmalı ("+nB(c)+"/"+BDOC.length+")";
  if(s==3&&!(c.signed&&c.paid))return"E-imza ve ilk ödeme gerekli (kapı kuralı)";
  if(s==4&&nT(c)<TL.length)return"Tüm birim görevleri tamamlanmalı ("+nT(c)+"/"+TL.length+")";
  if(s==5&&!c.slug)return"Şube web adresi (slug) girilmeli";
  if(s==5&&C.some(x=>x!==c&&x.slug==c.slug&&c.slug))return"Bu slug başka şubede kullanılıyor";
  if(s==5&&Object.keys(c.s).length<SU.length)return"Kurulum listesi tamamlanmalı ("+Object.keys(c.s).length+"/"+SU.length+")";
  return "";
}
function todo(){
  const r=R(),o=[];
  C.forEach(c=>{
    if(c.stage<0||!vis(c))return;
    const s=c.stage,P=t=>o.push([c,t]);
    if(s==0&&["fu","fd"].includes(r))P("Görüşme planla"+(c.slaGun>c.sla?" ⚠ SLA":""));
    if(s==1&&["fu","fd"].includes(r))P("Görüşme formunu tamamla ve skorla");
    if(s==2){const i=[0,1,2,3,4].find(i=>!c.a.includes(i));if(i!=null&&AP[i][1]==r)P("Onay: "+AP[i][0])}
    if(s==3){if(nB(c)<BDOC.length&&["fu","fd","hk"].includes(r))P("Belge eksik ("+nB(c)+"/"+BDOC.length+")");if(!c.signed&&r=="hk")P("E-imza doğrula");if(!c.paid&&r=="fn")P("İlk ödeme tahsil et")}

    <div class="row">ototr.com / <input data-slug value="${H(c.slug)}" ${["gm","fd","bt"].includes(R())?"":"disabled"} style="max-width:200px"></div>
    <h3>Kurulum listesi (${Object.keys(c.s).length}/${SU.length})</h3>
    ${SU.map((x,i)=>`<label class="ck"><input type="checkbox" data-su="${i}" ${c.s[i]?"checked":""} ${okR(x[1])?"":"disabled"}>${x[0]} <small class="mu">· ${RN[x[1]]}</small></label>`).join("")}`;
  if(s==6){
    const d=Math.round((new Date(c.bit)-TODAY)/864e5),F=["gm","fd"].includes(R()),k=c.durum=="Kapalı";
    b=`<div class="card">ototr.com/${H(c.slug)} · ${PC(c.durum)}<br>Royalty %${c.roy} · Sözleşme: ${c.bit} <span class="${d<=120?"wn":""}">(${d}g)</span><br>Cari: <b class="${bak(c)>0?"wn":"ok"}">${TRL(bak(c))}</b>${gec(c)?` <span class="rd">· ${gec(c)} gün gecikme</span>`:""}</div>
    ${k?`<p class="nt">Franchise ilişkisi sona erdi.</p>`:c.fes?
      `<h3>Kapanış kontrol listesi (${Object.keys(c.kf).length}/${KF.length})</h3>
      ${KF.map((x,i)=>`<label class="ck"><input type="checkbox" data-kf="${i}" ${c.kf[i]?"checked":""} ${okR(x[1])?"":"disabled"}>${x[0]} <small class="mu">· ${RN[x[1]]}</small></label>`).join("")}
      <div class="row" style="margin-top:12px"><button class="btn r" data-a="kapat" data-i="${c.id}" ${F&&KF.every((_,i)=>c.kf[i])&&bak(c)<=0?"":"disabled"}>Kapanışı tamamla</button></div>
      ${bak(c)>0?`<div class="al r">Cari bakiye ${TRL(bak(c))} — kapanış tamamlanamaz</div>`:""}`:
      `<div class="row"><button class="btn g" data-a="askida" data-i="${c.id}" ${F?"":"disabled"}>${c.durum=="Aktif"?"Askıya al":"Yeniden aktifleştir"}</button><button class="btn g" data-a="uzat" data-i="${c.id}" ${["gm","fd","hk"].includes(R())?"":"disabled"}>Sözleşmeyi 1 yıl uzat</button><button class="btn r" data-a="fes" data-i="${c.id}" ${R()=="gm"?"":"disabled"}>Fesih başlat</button></div>`}`;
  }
  const act=s>=0&&s<6?`<div class="row" style="margin-top:14px">
    <button class="btn" data-a="nxt" data-i="${c.id}" ${A&&!gt?"":"disabled"}>${s==3?"Paneli aç ve onboardingi başlat →":s==5?"Şubeyi aktifleştir →":"Sonraki aşamaya geç →"}</button>
    ${s<2&&A?`<select id="rj">${RJ.map(x=>`<option>${x}</option>`).join("")}</select><button class="btn g" data-a="rej" data-i="${c.id}">Reddet</button>`:""}
  </div>${!A?`<p class="nt">Aşama geçişini Franchise Direktörü veya GM yapar.</p>`:""}`:""
  return`<div class="row" style="justify-content:space-between;align-items:start;flex-wrap:nowrap">
    <div><h2 style="margin:0">${H(c.ad)}</h2><p class="mu" style="margin:2px 0;font-size:13px">${H(c.ilce)} · ${H(c.bolge)} · ${H(c.yat)} · ${c.kaynak}</p></div>
    <button class="btn g" data-a="close">✕</button>
  </div>
  <div class="sp">${STAGES.map((_,i)=>`<i class="${i<s?"d":i==s?"c":""}"></i>`).join("")}</div>
  <p class="mu" style="margin:0 0 10px;font-size:13px">${s<0?"Reddedildi":STAGES[s]+(s==6?" · "+c.durum:"")}</p>
  ${b}
  ${gt?`<div class="al r" style="margin-top:10px">${gt}</div>`:""}
  ${act}
  <h3>Not ve geçmiş</h3>
  <div class="row"><input id="nt" placeholder="Not ekle…" style="flex:1"><button class="btn g" data-a="note" data-i="${c.id}">Ekle</button></div>
  ${c.hist.slice(0,10).map(x=>`<div class="al">${H(x)}</div>`).join("")}`;
}
/* ══ RENDER ══ */
const VIEWS={e2e,departman,acilis,portallar,dash,hat,inbox,pipe,gor,belge,sube,web,paket,fin,rapor,yetki,denetim,model};
function render(){
  const perm=PERM[R()].split(" ");
  if(!perm.includes(CUR))CUR=perm[0]||"portallar";
  $("ttl").textContent=(NAV.find(x=>x[0]==CUR)||[])[2]||"";
  try{$("view").innerHTML=VIEWS[CUR]();}catch(e){$("view").innerHTML=`<div class="al r">Ekran yüklenirken hata: ${e.message}</div>`;}
  document.querySelectorAll("#nav .nb").forEach(b=>{
    b.classList.toggle("on",b.dataset.k==CUR);
    b.style.display=perm.includes(b.dataset.k)?"flex":"none";
  });
  const c=gC(SEL),mo=$("mo");
  mo.hidden=!c;
  if(c){try{mo.innerHTML=`<div class="dr">${panel(c)}</div>`;}catch(e){mo.hidden=true;}}
  try{localStorage.setItem(KEY,JSON.stringify({C,LOG,UID,FB,CUR,FLOW}))}catch(x){}
}
/* ══ AKSİYONLAR ══ */
const A={
  v:s=>{CUR=s.v;SEL=null;render()},
  hf:s=>{HF=s.r;render()},
  open:s=>{SEL=+s.i;render()},
  close:()=>{SEL=null;render()},
  gsel:s=>{SEL=+s.i;render()},
  dtab:s=>{DTAB=s.t;render()},
  add:()=>{
    const n=$("na")?.value.trim();if(!n)return;
    const c=mkC(n,$("ni")?.value||"-",$("ny")?.value||"-",0,{kaynak:$("nk")?.value||"Web"});
    C.push(c);LOG_ADD("Yeni aday: "+n,c);render();
  },
  nxt:s=>{
    const c=gC(+s.i);if(!adv(c)||gate(c))return;
    const msgs=["Görüşme planlandı","Kurul değerlendirmesine gönderildi (skor "+scr(c)+")","Onay zinciri tamamlandı — sözleşme hazırlandı","Panel hesabı açıldı; birim görevleri oluşturuldu","Onboarding tamamlandı — şube kurulumu başladı","Şube aktifleştirildi"];
    if(c.stage==3&&!c.slug)c.slug=SL(c.ad);
    if(c.stage==5){c.durum="Aktif";c.bit="2031-11-04"}
    LOG_ADD(c.ad+": "+msgs[c.stage],c);c.stage++;render();
  },
  rej:s=>{const c=gC(+s.i),r=$("rj")?.value||"Kurul kararı";c.stage=-1;c.rj=r;LOG_ADD("Reddedildi: "+c.ad+" ("+r+")",c);SEL=null;render()},
  reopen:s=>{const c=gC(+s.i);c.stage=0;c.rj="";LOG_ADD("Yeniden açıldı: "+c.ad,c);render()},
  note:s=>{const t=$("nt")?.value.trim();if(t){gC(+s.i).hist.unshift(DL()+" · "+RN[R()]+" · "+t);render()}},
  bdoc:s=>{const c=gC(+s.ci);c.belge[s.bi]=1;LOG_ADD(c.ad+": belge — "+BDOC[+s.bi],c);render()},
  donem:()=>{C.filter(c=>c.stage==6&&c.durum!="Kapalı").forEach(c=>{if(!c.led.some(x=>x.dn=="2026-11"))c.led.push(tah(c,"2026-11","2026-12-10"))});LOG_ADD("Kasım 2026 tahakkukları oluşturuldu");render()},
  tahs:()=>{const c=gC(FB);const t=Math.min(+($("th")?.value)||0,bak(c));if(t<=0)return;c.led.push({tip:"O",dn:"2026-11",vd:"",tt:t});LOG_ADD("Tahsilat: "+c.ad+" · "+TRL(t),c);render()},
  tahall:()=>{const c=gC(FB);const t=bak(c);if(t>0){c.led.push({tip:"O",dn:"2026-11",vd:"",tt:t});LOG_ADD("Tam tahsilat: "+c.ad+" · "+TRL(t),c);render()}},
  askida:s=>{const c=gC(+s.i);c.durum=c.durum=="Aktif"?"Askıda":"Aktif";LOG_ADD("Durum → "+c.durum+": "+c.ad,c);render()},
  uzat:s=>{const c=gC(+s.i);c.bit=(+c.bit.slice(0,4)+1)+c.bit.slice(4);LOG_ADD("Sözleşme uzatıldı: "+c.ad+" → "+c.bit,c);render()},
  fes:s=>{const c=gC(+s.i);c.fes=1;c.durum="Kapanışta";LOG_ADD("Fesih başlatıldı: "+c.ad,c);render()},
  kapat:s=>{const c=gC(+s.i);if(bak(c)>0)return;c.durum="Kapalı";c.fes=0;LOG_ADD("Franchise kapatıldı: "+c.ad,c);render()}
};
document.addEventListener("click",ev=>{
  if(ev.target===$("mo")){SEL=null;render();return}
  const flowAction=ev.target.closest("[data-e2e]");
  if(flowAction){
    const action=flowAction.dataset.e2e;
    if(action==="advance"&&!flowStageGate()&&[E2E_STAGE_OWNER[FLOW.stage],"gm"].includes(R())){FLOW.history.unshift(DL()+" · "+RN[R()]+" · "+E2E_STAGES[FLOW.stage]+" tamamlandı; "+(E2E_STAGES[FLOW.stage+1]||"ilk 90 gün")+" başladı");FLOW.stage=Math.min(E2E_STAGES.length-1,FLOW.stage+1)}
    if(action==="day"){FLOW.days++;FLOW.history.unshift(DL()+" · Sistem · Program günü "+FLOW.days+" olarak güncellendi")}
    if(action==="exception"){FLOW.exceptions.push({id:Date.now(),stage:E2E_STAGES[FLOW.stage],requester:RN[R()],status:"İkinci onay bekliyor"});FLOW.history.unshift(DL()+" · "+RN[R()]+" · "+E2E_STAGES[FLOW.stage]+" için istisna talebi açtı")}
    if(action==="activate"&&R()==="gm"){FLOW.stage=13;FLOW.history.unshift(DL()+" · Genel Müdür · Şube aktif edildi; 30/60/90 gün görevleri oluşturuldu")}
    render();return;
  }
  const el=ev.target.closest("[data-a]");
  if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset);
});
document.addEventListener("change",ev=>{
  const t=ev.target,d=t.dataset,c=gC(SEL);
  if(d.flowTask){const role=DEPT_ROLE[d.flowTask.split("|")[0]];if(R()===role||R()==="gm"){t.checked?FLOW.tasks[d.flowTask]=1:delete FLOW.tasks[d.flowTask];FLOW.history.unshift(DL()+" · "+RN[R()]+" · Görev "+(t.checked?"tamamlandı: ":"geri açıldı: ")+d.flowTask);render()}return}
  if("fb" in d){FB=+t.value;render();return}
  if(d.f){const x=gC(+d.i);if(x){x[d.f]=Math.max(0,+t.value||0);LOG_ADD("Royalty güncellendi: "+x.ad+" "+d.f,x);render();}return}
  if(d.ind){const x=gC(+d.i);if(x){x.indirim=Math.max(0,Math.min(20,+t.value||0));render();}return}
  if(d.gsc!==undefined){const x=gC(+d.i);if(x){x.sc[+d.gsc]=+t.value;const sv=$("gsv"+d.gsc),st=$("gst");if(sv)sv.textContent=t.value;if(st)st.textContent=scr(x);}return}
  if(!c)return;
  if(d.ap!==undefined){const i=+d.ap,k=c.a.indexOf(i);k<0?c.a.push(i):c.a.splice(k,1);LOG_ADD(c.ad+": "+AP[i][0]+(k<0?" ✓":" geri alındı"),c)}
  else if(d.sg){c[d.sg]=t.checked?1:0;LOG_ADD(c.ad+": "+(d.sg=="signed"?"e-imza":"ilk ödeme")+(t.checked?" ✓":" geri alındı"),c)}
  else if(d.tk){t.checked?c.t[d.tk]=1:delete c.t[d.tk];LOG_ADD(c.ad+": görev — "+d.tk,c)}
  else if(d.su!==undefined){t.checked?c.s[+d.su]=1:delete c.s[+d.su];LOG_ADD(c.ad+": kurulum — "+SU[+d.su][0],c)}
  else if(d.kf!==undefined){t.checked?c.kf[+d.kf]=1:delete c.kf[+d.kf];LOG_ADD(c.ad+": kapanış — "+KF[+d.kf][0],c)}
  else if(d.bdoc!==undefined){c.belge[+d.bdoc]=t.checked?1:0;LOG_ADD(c.ad+": belge — "+BDOC[+d.bdoc],c)}
  else if(d.gf!==undefined){c.gf[+d.gf]=t.checked;LOG_ADD(c.ad+": görüşme formu — "+GF[+d.gf],c)}
  else if(d.slug!==undefined){c.slug=SL(t.value)}
  else return;
  render();
});
document.addEventListener("input",ev=>{
  const d=ev.target.dataset;
  if(d.sc!==undefined){const c=gC(SEL);if(!c)return;c.sc[+d.sc]=+ev.target.value;const sv=$("sv"+d.sc),st=$("st"),so=$("so");if(sv)sv.textContent=ev.target.value;if(st){st.textContent=scr(c);if(so){so.textContent=scr(c)>=60?"✓ Onaya uygun":"✗ Yetersiz";so.className=scr(c)>=60?"ok":"rd"}}}
  if(d.gnot!==undefined){const c=gC(+d.i);if(c)c.gnot=ev.target.value}
});
/* ══ NAV OLUŞTUR ══ */
const navEl=$("nav");
NAV.forEach(n=>{
  if(!n[0]){
    const d=document.createElement("div");
    d.className="ns";d.textContent=n[2]||n[1];
    navEl.appendChild(d);return;
  }
  const b=document.createElement("button");
  b.className="nb";b.dataset.k=n[0];
  b.innerHTML=`<span>${n[2]||n[1]}</span>${n[3]?'<span class="tg">MVP</span>':""}`;
  b.addEventListener("click",()=>{CUR=n[0];SEL=null;render();});
  navEl.appendChild(b);
});
$("role").addEventListener("change",()=>{SEL=null;render()});
$("rst").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()});
try{const j=JSON.parse(localStorage.getItem(KEY)||"null");if(j?.C){C=j.C;LOG=j.LOG||[];UID=j.UID||UID;FB=j.FB||1;if(j.CUR&&VIEWS[j.CUR])CUR=j.CUR;if(j.FLOW)FLOW=j.FLOW}}catch(e){}
render();
</script>

const { useState, useMemo, useRef, useEffect, useCallback } = React;

const appStorage = (() => {
  const external = window.storage;
  if (external && typeof external.get === "function" && typeof external.set === "function") {
    return {
      available: true,
      get: external.get.bind(external),
      set: external.set.bind(external),
    };
  }
  let available = true;
  try {
    const testKey = "ototr-paket-matrisi:storage-test";
    localStorage.setItem(testKey, "1");
    localStorage.removeItem(testKey);
  } catch (e) {
    available = false;
  }
  return {
    available,
    async get(key) {
      if (!available) return null;
      return { value: localStorage.getItem(key) };
    },
    async set(key, value) {
      if (!available) throw new Error("Kalıcı depolama kullanılamıyor");
      localStorage.setItem(key, value);
      return { ok: true };
    },
  };
})();

// ---- Minimal lucide-style icon set (inline SVG, no external icon package) ----
function Icon({ name, size = 14, color, strokeWidth = 2, style }) {

    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: color || "currentColor", strokeWidth, strokeLinecap: "round",
    strokeLinejoin: "round", style,
  };
  switch (name) {
    case "check": return <svg {...common}><polyline points="20 6 9 17 4 12" /></svg>;
    case "plus": return <svg {...common}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "x": return <svg {...common}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "trash": return <svg {...common}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M8.5 6V4a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v2" /></svg>;
    case "save": return <svg {...common}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></svg>;
    case "folder": return <svg {...common}><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></svg>;
    case "download": return <svg {...common}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>;
    case "sheet": return <svg {...common}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><polyline points="14 2 14 8 20 8" /><path d="M8 13h2" /><path d="M14 13h2" /><path d="M8 17h2" /><path d="M14 17h2" /></svg>;
    case "doc": return <svg {...common}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><line x1="10" y1="9" x2="8" y2="9" /></svg>;
    case "chart": return <svg {...common}><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></svg>;
    case "grid": return <svg {...common}><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /><path d="M3 15h18" /><path d="M9 3v18" /><path d="M15 3v18" /></svg>;
    case "grip": return <svg {...common}><circle cx="9" cy="5" r="1" /><circle cx="9" cy="12" r="1" /><circle cx="9" cy="19" r="1" /><circle cx="15" cy="5" r="1" /><circle cx="15" cy="12" r="1" /><circle cx="15" cy="19" r="1" /></svg>;
    case "trend": return <svg {...common}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>;
    case "alert": return <svg {...common}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>;
    case "chevronDown": return <svg {...common}><polyline points="6 9 12 15 18 9" /></svg>;
    case "copy": return <svg {...common}><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>;
    case "clock": return <svg {...common}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>;
    case "link": return <svg {...common}><path d="M9 17H7A5 5 0 0 1 7 7h2" /><path d="M15 7h2a5 5 0 1 1 0 10h-2" /><line x1="8" y1="12" x2="16" y2="12" /></svg>;
    default: return null;
  }
}

// ---- Tier color ramp: steel → OTOTR red, one stop per package rank ----
const TIER_RAMP = ["#576273", "#8B4B44", "#C43A2A", "#E8281A"];
const tierColor = (rank, total) => {
  if (total <= 1) return TIER_RAMP[TIER_RAMP.length - 1];
  const t = rank / (total - 1);
  const stops = TIER_RAMP;
  const seg = t * (stops.length - 1);
  const i = Math.min(Math.floor(seg), stops.length - 2);
  const f = seg - i;
  const hex = (h) => [1, 3, 5].map((s) => parseInt(h.slice(s, s + 2), 16));
  const [a, b] = [hex(stops[i]), hex(stops[i + 1])];
  const mix = a.map((v, idx) => Math.round(v + (b[idx] - v) * f));
  return `rgb(${mix.join(",")})`;
};

let uid = 1000;
const nextId = (p) => `${p}-${uid++}`;
const uniqueId = (prefix, usedIds = []) => {
  const used = usedIds instanceof Set ? usedIds : new Set(usedIds.map(String));
  let id = "";
  do {
    id = `${prefix}-${Date.now().toString(36)}-${(uid++).toString(36)}`;
  } while (used.has(id));
  return id;
};

function buildInitialItems() {
  const rows = [];
  initialCategories.forEach((cat) => {
    cat.items.forEach((label) => {
      rows.push({ id: nextId("item"), categoryId: cat.id, label });
    });
  });
  return rows;
}

function buildInitialCategoryList() {
  return initialCategories.map((c) => ({ id: c.id, name: c.name }));
}

function buildInitialMatrix(items, packages) {
  const includedByItem = {
    "Kaporta-boya kontrolü": ["p1", "p2", "p3", "p4"],
    "Motor-mekanik kontrolü": ["p1", "p2", "p3", "p4"],
    "Yol testi / dinamometre": ["p1", "p2", "p3", "p4"],
    "Alt mekanik kontrolü": ["p1", "p2", "p3", "p4"],
    "Şanzıman kontrolü": ["p1", "p2", "p3", "p4"],
    "OBD arıza taraması": ["p2", "p3", "p4"],
    "Yanal kayma testi": ["p2", "p3", "p4"],
    "Fren testi Süspansiyon": ["p2", "p3", "p4"],
    "İç ekspertiz": ["p2", "p3", "p4"],
    "Dış ekspertiz": ["p2", "p3", "p4"],
    "Conta kaçak testi": ["p2", "p3", "p4"],
    "Airbag kontrolü": ["p3", "p4"],
    "Borç sorgulama": ["p1", "p2", "p3", "p4"],
    "Hasar sorgulama": ["p1", "p2", "p3", "p4"],
    "Km Sorgu": ["p2", "p3", "p4"],
    "Km Sorgu 3 lü Kontrol": ["p3"],
    "Kaskolu/kaskosuz dönem sorgulama": ["p3", "p4"],
    "Tüm değişenler sorgulama": ["p3", "p4"],
    "Araç detay sorgulama": ["p3", "p4"],
  };
  const m = {};
  items.forEach((row) => {
    const included = new Set(includedByItem[row.label] || []);
    packages.forEach((pkg) => {
      m[`${row.id}:${pkg.id}`] = included.has(pkg.id);
    });
  });
  return m;
}

const MATRIX_SCHEMA_VERSION = "2026-09-13-reference";
const STORAGE_KEY = `ototr-paket-matrisi:${MATRIX_SCHEMA_VERSION}:senaryolar`;
const AUTOSAVE_KEY = `ototr-paket-matrisi:${MATRIX_SCHEMA_VERSION}:autosave`;

function buildDefaultState() {
  const items = buildInitialItems();
  return {
    packages: initialPackages,
    categoryList: buildInitialCategoryList(),
    items,
    matrix: buildInitialMatrix(items, initialPackages),
    garanti: Object.fromEntries(
      initialPackages.map((p, i) => [p.id, i === initialPackages.length - 1])
    ),
  };
}

function snapshotOf(state) {
  return {
    version: MATRIX_SCHEMA_VERSION,
    packages: state.packages,
    categoryList: state.categoryList,
    items: state.items,
    matrix: state.matrix,
    garanti: state.garanti,
  };
}

function normalizeSavedState(state) {
  const fallback = buildDefaultState();
  const packages = Array.isArray(state?.packages) ? state.packages : fallback.packages;
  const categoryList = Array.isArray(state?.categoryList) ? state.categoryList : fallback.categoryList;
  const matrix = state?.matrix && typeof state.matrix === "object" ? { ...state.matrix } : fallback.matrix;
  const garanti = state?.garanti && typeof state.garanti === "object" ? state.garanti : fallback.garanti;
  const sourceItems = Array.isArray(state?.items) ? state.items : fallback.items;
  const usedItemIds = new Set();
  const items = sourceItems.map((row) => {
    const originalId = row?.id ? String(row.id) : "";
    let id = originalId;
    if (!id || usedItemIds.has(id)) {
      id = uniqueId("item", usedItemIds);
      packages.forEach((pkg) => {
        matrix[`${id}:${pkg.id}`] = originalId ? !!matrix[`${originalId}:${pkg.id}`] : false;
      });
    }
    usedItemIds.add(id);
    return { ...row, id };
  });
  return { packages, categoryList, items, matrix, garanti, savedAt: state?.savedAt || null };
}

function useMediaQuery(query) {
  const getMatch = () =>
    typeof window !== "undefined" && typeof window.matchMedia === "function"
      ? window.matchMedia(query).matches
      : false;
  const [matches, setMatches] = useState(getMatch);
  useEffect(() => {
    if (typeof window === "undefined" || typeof window.matchMedia !== "function") return;
    const media = window.matchMedia(query);
    const update = () => setMatches(media.matches);
    update();
    if (typeof media.addEventListener === "function") media.addEventListener("change", update);
    else media.addListener(update);
    return () => {
      if (typeof media.removeEventListener === "function") media.removeEventListener("change", update);
      else media.removeListener(update);
    };
  }, [query]);
  return matches;
}

// ---------------------------------------------------------------------------

function PaketMatrisi() {
  const initial = useMemo(buildDefaultState, []);
  const [packages, setPackages] = useState(initial.packages);
  const [categoryList, setCategoryList] = useState(initial.categoryList);
  const [items, setItems] = useState(initial.items);
  const [matrix, setMatrix] = useState(initial.matrix);
  const [garanti, setGaranti] = useState(initial.garanti);
  const [editingCell, setEditingCell] = useState(null);
  const [editingCategory, setEditingCategory] = useState(null);
  const [view, setView] = useState("matrix"); // matrix | analytics
  const [scenarios, setScenarios] = useState([]);
  const [scenarioName, setScenarioName] = useState("");
  const [showLoadMenu, setShowLoadMenu] = useState(false);
  const [showExportMenu, setShowExportMenu] = useState(false);
  const [toast, setToast] = useState(null);
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [storageAvailable, setStorageAvailable] = useState(appStorage.available);

  const dragCategory = useRef(null);
  const dragItem = useRef(null);
  const toastTimer = useRef(null);
  const autosaveTimer = useRef(null);
  const isMobile = useMediaQuery("(max-width: 700px)");
  const isTablet = useMediaQuery("(max-width: 980px)");
  const labelColWidth = isMobile ? 188 : isTablet ? 220 : 260;
  const packageColMin = isMobile ? 112 : isTablet ? 132 : 150;
  const packageColWidth = isMobile ? 118 : isTablet ? 144 : 168;
  const matrixMinWidth = labelColWidth + packages.length * packageColWidth;
  const rowStyle = useMemo(
    () => ({
      ...styles.gridRow,
      gridTemplateColumns: `${labelColWidth}px repeat(${packages.length}, minmax(${packageColMin}px, 1fr))`,
    }),
    [labelColWidth, packageColMin, packages.length]
  );
  const stickyCellStyle = isMobile
    ? {
        position: "sticky",
        left: 0,
        zIndex: 2,
        background: "#101317",
        boxShadow: "10px 0 18px rgba(16,19,23,0.72)",
      }
    : null;
  const stickyHeaderCellStyle = isMobile ? { ...stickyCellStyle, zIndex: 5 } : null;
  const pageStyle = isMobile ? { ...styles.page, ...styles.pageMobile } : styles.page;
  const headerStyle = isMobile ? { ...styles.header, ...styles.headerMobile } : styles.header;
  const toolbarStyle = isMobile ? { ...styles.toolbar, ...styles.toolbarMobile } : styles.toolbar;

  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  }, []);

  // ---- Persistence: load autosave + scenario list on mount ----------------
  useEffect(() => {
    (async () => {
      try {
        const auto = await appStorage.get(AUTOSAVE_KEY);
        if (auto?.value) {
          const s = normalizeSavedState(JSON.parse(auto.value));
          if (s.packages) setPackages(s.packages);
          if (s.categoryList) setCategoryList(s.categoryList);
          if (s.items) setItems(s.items);
          if (s.matrix) setMatrix(s.matrix);
          if (s.garanti) setGaranti(s.garanti);
          setLastSavedAt(s.savedAt || null);
        }
      } catch (e) {
        // no autosave yet, or storage unavailable in this environment
      }
      try {
        const list = await appStorage.get(STORAGE_KEY);
        if (list?.value) setScenarios(JSON.parse(list.value));
      } catch (e) {
        // no scenarios yet
      }
      try {
        setStorageAvailable(appStorage.available);
      } catch (e) {
        setStorageAvailable(false);
      }
    })();
  }, []);

  // ---- Autosave (debounced) ------------------------------------------------
  useEffect(() => {
    clearTimeout(autosaveTimer.current);
    autosaveTimer.current = setTimeout(async () => {
      const payload = { ...snapshotOf({ packages, categoryList, items, matrix, garanti }), savedAt: Date.now() };
      try {
        await appStorage.set(AUTOSAVE_KEY, JSON.stringify(payload));
        setLastSavedAt(payload.savedAt);
      } catch (e) {
        // ignore autosave failures silently
      }
    }, 900);
    return () => clearTimeout(autosaveTimer.current);
  }, [packages, categoryList, items, matrix, garanti]);

  const saveScenario = async () => {
    const name = scenarioName.trim() || `Senaryo ${scenarios.length + 1}`;
    const entry = {
      id: uniqueId("scn", scenarios.map((s) => s.id)),
      name,
      savedAt: Date.now(),
      data: snapshotOf({ packages, categoryList, items, matrix, garanti }),
    };
    const next = [entry, ...scenarios].slice(0, 20);
    setScenarios(next);
    setScenarioName("");
    try {
      await appStorage.set(STORAGE_KEY, JSON.stringify(next));
      showToast(`"${name}" kaydedildi`);
    } catch (e) {
      showToast("Kaydetme başarısız oldu");
    }
  };

  const loadScenario = (entry) => {
    const data = normalizeSavedState(entry.data);
    setPackages(data.packages);
    setCategoryList(data.categoryList);
    setItems(data.items);
    setMatrix(data.matrix);
    setGaranti(data.garanti);
    setShowLoadMenu(false);
    showToast(`"${entry.name}" yüklendi`);
  };

  const deleteScenario = async (id, e) => {
    e.stopPropagation();
    const next = scenarios.filter((s) => s.id !== id);
    setScenarios(next);
    try {
      await appStorage.set(STORAGE_KEY, JSON.stringify(next));
    } catch (err) {
      // ignore
    }
  };

  // ---- Matrix mutations -----------------------------------------------------
  const toggleCell = (itemId, pkgId) => {
    setMatrix((m) => ({ ...m, [`${itemId}:${pkgId}`]: !m[`${itemId}:${pkgId}`] }));
  };

  const toggleGaranti = (pkgId) => {
    setGaranti((g) => ({ ...g, [pkgId]: !g[pkgId] }));
  };

  const addPackage = () => {
    const id = uniqueId("pkg", packages.map((pkg) => pkg.id));
    const last = packages[packages.length - 1];
    setPackages((p) => [
      ...p,
      { id, name: "Yeni Paket", price: (last?.price ?? 6000) + 1500, cost: last?.cost ?? 2000 },
    ]);
    setMatrix((m) => {
      const copy = { ...m };
      items.forEach((row) => (copy[`${row.id}:${id}`] = false));
      return copy;
    });
    setGaranti((g) => ({ ...g, [id]: false }));
  };

  const removePackage = (pkgId) => {
    if (packages.length <= 1) return;
    setPackages((p) => p.filter((x) => x.id !== pkgId));
  };

  const renamePackage = (pkgId, name) =>
    setPackages((p) => p.map((x) => (x.id === pkgId ? { ...x, name } : x)));

  const repricePackage = (pkgId, price) =>
    setPackages((p) => p.map((x) => (x.id === pkgId ? { ...x, price: Number(price) || 0 } : x)));

  const recostPackage = (pkgId, cost) =>
    setPackages((p) => p.map((x) => (x.id === pkgId ? { ...x, cost: Number(cost) || 0 } : x)));

  const duplicatePackage = (pkgId) => {
    const src = packages.find((p) => p.id === pkgId);
    if (!src) return;
    const id = uniqueId("pkg", packages.map((pkg) => pkg.id));
    const idx = packages.findIndex((p) => p.id === pkgId);
    const copy = { ...src, id, name: `${src.name} (kopya)` };
    setPackages((p) => [...p.slice(0, idx + 1), copy, ...p.slice(idx + 1)]);
    setMatrix((m) => {
      const next = { ...m };
      items.forEach((row) => (next[`${row.id}:${id}`] = !!m[`${row.id}:${pkgId}`]));
      return next;
    });
    setGaranti((g) => ({ ...g, [id]: !!g[pkgId] }));
  };

  // ---- Category mutations -----------------------------------------------------
  const addCategory = () => {
    const id = uniqueId("cat", categoryList.map((cat) => cat.id));
    setCategoryList((c) => [...c, { id, name: "Yeni kategori" }]);
  };

  const renameCategory = (catId, name) =>
    setCategoryList((c) => c.map((x) => (x.id === catId ? { ...x, name } : x)));

  const removeCategory = (catId) => {
    setCategoryList((c) => c.filter((x) => x.id !== catId));
    setItems((it) => it.filter((row) => row.categoryId !== catId));
  };

  const reorderCategory = (fromId, toId) => {
    if (fromId === toId) return;
    setCategoryList((c) => {
      const arr = [...c];
      const fromIdx = arr.findIndex((x) => x.id === fromId);
      const toIdx = arr.findIndex((x) => x.id === toId);
      if (fromIdx < 0 || toIdx < 0) return c;
      const [moved] = arr.splice(fromIdx, 1);
      arr.splice(toIdx, 0, moved);
      return arr;
    });
  };

  // ---- Item mutations -----------------------------------------------------
  const addItem = (categoryId) => {
    const id = uniqueId("item", items.map((row) => row.id));
    setItems((it) => [...it, { id, categoryId, label: "Yeni hizmet kalemi" }]);
    setMatrix((m) => {
      const copy = { ...m };
      packages.forEach((pkg) => (copy[`${id}:${pkg.id}`] = false));
      return copy;
    });
  };

  const renameItem = (itemId, label) =>
    setItems((it) => it.map((row) => (row.id === itemId ? { ...row, label } : row)));

  const removeItem = (itemId) => setItems((it) => it.filter((row) => row.id !== itemId));

  const reorderItem = (fromId, toId) => {
    if (fromId === toId) return;
    setItems((it) => {
      const arr = [...it];
      const fromIdx = arr.findIndex((x) => x.id === fromId);
      const toIdx = arr.findIndex((x) => x.id === toId);
      if (fromIdx < 0 || toIdx < 0) return it;
      if (arr[fromIdx].categoryId !== arr[toIdx].categoryId) return it; // keep within category
      const [moved] = arr.splice(fromIdx, 1);
      arr.splice(toIdx, 0, moved);
      return arr;
    });
  };

  // ---- Derived data -----------------------------------------------------
  const counts = useMemo(() => {
    const perPackage = {};
    packages.forEach((pkg) => {
      perPackage[pkg.id] = items.filter((row) => matrix[`${row.id}:${pkg.id}`]).length;
    });
    const perItem = {};
    items.forEach((row) => {
      perItem[row.id] = packages.filter((pkg) => matrix[`${row.id}:${pkg.id}`]).length;
    });
    return { perPackage, perItem };
  }, [items, packages, matrix]);

  const maxPrice = Math.max(...packages.map((p) => p.price), 1);

  const analytics = useMemo(() => {
    const perPackage = packages.map((pkg, i) => {
      const n = counts.perPackage[pkg.id] || 0;
      const margin = pkg.price - (pkg.cost || 0);
      const marginPct = pkg.price > 0 ? (margin / pkg.price) * 100 : 0;
      return {
        ...pkg,
        rank: i,
        itemCount: n,
        perItemPrice: n > 0 ? pkg.price / n : 0,
        margin,
        marginPct,
      };
    });

    const total = packages.length;
    const differentiators = items.filter((row) => (counts.perItem[row.id] || 0) === 1);
    const baseline = items.filter((row) => (counts.perItem[row.id] || 0) === total);
    const gaps = items.filter((row) => {
      const n = counts.perItem[row.id] || 0;
      return n > 0 && n < total;
    });

    const jumps = [];
    for (let i = 1; i < packages.length; i++) {
      const prev = packages[i - 1];
      const cur = packages[i];
      const priceDelta = cur.price - prev.price;
      const itemDelta = (counts.perPackage[cur.id] || 0) - (counts.perPackage[prev.id] || 0);
      jumps.push({
        from: prev.name,
        to: cur.name,
        priceDelta,
        itemDelta,
        perExtraItem: itemDelta > 0 ? priceDelta / itemDelta : null,
      });
    }

    return { perPackage, differentiators, baseline, gaps, jumps, total };
  }, [packages, items, counts]);

  // ---- Export: CSV / Excel-friendly ----------------------------------------
  const exportCSV = () => {
    const header = ["Kategori", "Hizmet Kalemi", ...packages.map((p) => p.name)];
    const rows = [header];
    categoryList.forEach((cat) => {
      items
        .filter((row) => row.categoryId === cat.id)
        .forEach((row) => {
          rows.push([
            cat.name,
            row.label,
            ...packages.map((pkg) => (matrix[`${row.id}:${pkg.id}`] ? "Evet" : "")),
          ]);
        });
    });
    rows.push(["", "7 gün / 1.000 km geri alım garantisi", ...packages.map((pkg) => (garanti[pkg.id] ? "Evet" : ""))]);
    rows.push([]);
    rows.push(["", "Fiyat (TL)", ...packages.map((p) => p.price)]);
    rows.push(["", "Kalem sayısı", ...packages.map((p) => counts.perPackage[p.id])]);

    const csv = rows
      .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
      .join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ototr-paket-matrisi.csv";
    a.click();
    URL.revokeObjectURL(url);
    setShowExportMenu(false);
    showToast("CSV indirildi");
  };

  const exportPrintPDF = () => {
    setShowExportMenu(false);
    window.print();
  };

  const copyShareSummary = async () => {
    const lines = [];
    lines.push("OTOTR · Paket Karşılaştırma");
    lines.push("");
    packages.forEach((pkg) => {
      lines.push(`${pkg.name} — ${pkg.price.toLocaleString("tr-TR")} TL (${counts.perPackage[pkg.id]} kalem)`);
    });
    lines.push("");
    categoryList.forEach((cat) => {
      lines.push(`# ${cat.name}`);
      items
        .filter((row) => row.categoryId === cat.id)
        .forEach((row) => {
          const included = packages.filter((pkg) => matrix[`${row.id}:${pkg.id}`]).map((p) => p.name);
          lines.push(`- ${row.label}: ${included.length ? included.join(", ") : "—"}`);
        });
      lines.push("");
    });
    const text = lines.join("\n");
    try {
      await navigator.clipboard.writeText(text);
      showToast("Özet panoya kopyalandı");

  };

  const fmtTime = (ts) => {

        .cell-btn {

        }

        }
        .pkg-input:focus { border-bottom: 1px solid #E8281A; }
        .item-input {
          background: transparent; border: none; color: inherit; font: inherit; outline: none; width: 100%;
        }
        .item-input:focus { border-bottom: 1px solid #576273; }

        .del-btn { opacity: 0; transition: opacity .12s ease; }
        .row-hover:hover .del-btn, .pkg-head:hover .del-btn, .cat-hover:hover .del-btn { opacity: 1; }
        .drag-handle { opacity: 0; transition: opacity .12s ease; cursor: grab; }
        .row-hover:hover .drag-handle, .cat-hover:hover .drag-handle { opacity: 1; }
        .matrix-scroll::-webkit-scrollbar { height: 10px; }

        .add-row-btn:hover { color: #EDEFF2 !important; border-color: #576273 !important; }

        .toolbar-btn:hover { background: #1D2229 !important; border-color: #3A414C !important; }
        .tab-btn { transition: color .12s ease, border-color .12s ease; }
        .menu-item:hover { background: #1D2229 !important; }
        .toast {

          background: #171B20; border: 1px solid #2A2F37; color: #EDEFF2;
          padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 50;

        }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @media (max-width: 700px) {

          .matrix-toolbar { display: grid !important; grid-template-columns: 1fr 1fr; width: 100%; align-items: stretch !important; }
          .matrix-tabs { grid-column: 1 / -1; width: 100%; }
          .matrix-tabs .tab-btn { flex: 1; justify-content: center; min-height: 42px; }
          .matrix-menu-anchor { min-width: 0; width: 100%; }
          .toolbar-btn, .add-pkg-btn { width: 100%; min-height: 42px; justify-content: center; padding: 9px 10px !important; }

      <header className="matrix-header" style={headerStyle}>

      {/* Margin table */}
      <section className="analytics-card" style={styles.analyticsCard}>
        <h3 style={styles.analyticsTitle}>Kâr marjı</h3>
        <p style={styles.analyticsHint}>
          Maliyet alanına tahmini iş gücü + parça + üçüncü taraf maliyetini girin; marj otomatik hesaplanır.
        </p>
        <div className="analytics-margin-table" style={styles.marginTable}>
          <div style={{ ...styles.marginRow, ...styles.marginHeaderRow }}>
            <div>Paket</div>
            <div style={{ textAlign: "right" }}>Fiyat</div>
            <div style={{ textAlign: "right" }}>Maliyet</div>
            <div style={{ textAlign: "right" }}>Marj</div>
            <div style={{ textAlign: "right" }}>Marj %</div>
          </div>
          {analytics.perPackage.map((pkg) => {
            const color = tierColor(pkg.rank, packages.length);
            return (
              <div key={pkg.id} style={styles.marginRow}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: color, flexShrink: 0 }} />
                  {pkg.name}
                </div>
                <div style={{ textAlign: "right" }}>{pkg.price.toLocaleString("tr-TR")} TL</div>
                <div style={{ textAlign: "right" }}>
                  <input
                    value={pkg.cost}
                    onChange={(e) => recostPackage(pkg.id, e.target.value.replace(/[^0-9]/g, ""))}
                    style={styles.costInput}
                  />
                </div>
                <div style={{ textAlign: "right", color: pkg.margin >= 0 ? "#7FBF6A" : "#E8281A" }}>
                  {pkg.margin.toLocaleString("tr-TR")} TL
                </div>
                <div style={{ textAlign: "right", fontWeight: 700 }}>{pkg.marginPct.toFixed(0)}%</div>
              </div>
            );
          })}
        </div>
        <div style={styles.marginBars}>
          {analytics.perPackage.map((pkg) => {
            const color = tierColor(pkg.rank, packages.length);
            const pct = Math.max(0, Math.round((pkg.margin / maxMargin) * 100));
            return (
              <div key={pkg.id} style={styles.marginBarItem}>
                <div style={styles.marginBarTrack}>
                  <div style={{ ...styles.marginBarFill, height: `${pct}%`, background: color }} />
                </div>
                <div style={styles.marginBarLabel}>{pkg.name}</div>
              </div>
            );
          })}
        </div>
      </section>

      {/* Tier jump analysis */}
      <section className="analytics-card" style={styles.analyticsCard}>
        <h3 style={styles.analyticsTitle}>Kademe geçiş analizi</h3>
        <p style={styles.analyticsHint}>Bir üst pakete geçişte fiyat artışının kalem başına karşılığı.</p>
        {analytics.jumps.length === 0 ? (
          <div style={styles.emptyNote}>Karşılaştırma için en az iki paket gerekir.</div>
        ) : (
          <div style={styles.jumpList}>
            {analytics.jumps.map((j, idx) => (
              <div key={idx} className="analytics-jump-row" style={styles.jumpRow}>
                <div style={{ fontSize: 13 }}>
                  <strong>{j.from}</strong> → <strong>{j.to}</strong>
                </div>
                <div style={{ display: "flex", gap: 18, fontSize: 12.5, color: "#9AA3AF" }}>
                  <span>+{j.priceDelta.toLocaleString("tr-TR")} TL</span>
                  <span>+{j.itemDelta} kalem</span>
                  <span style={{ color: "#DADEE3", fontWeight: 600 }}>
                    {j.perExtraItem != null
                      ? `${Math.round(j.perExtraItem).toLocaleString("tr-TR")} TL/kalem`
                      : "kalem farkı yok"}
                  </span>
                </div>
              </div>
            ))}
          </div>
        )}
      </section>

      {/* Gap / coverage analysis */}
      <section className="analytics-card" style={styles.analyticsCard}>
        <h3 style={styles.analyticsTitle}>Boşluk analizi</h3>
        <p style={styles.analyticsHint}>
          Farklılaştırıcı kalemler (sadece 1 pakette) yükseltme için satış argümanı; temel kalemler
          (tüm paketlerde) müşteri beklentisinin tabanıdır.
        </p>
        <div className="analytics-gap-grid" style={styles.gapGrid}>
          <div style={styles.gapCol}>
            <div style={styles.gapColHeader}>
              <Icon name="alert" size={13} color="#E8281A" />
              Farklılaştırıcılar ({analytics.differentiators.length})
            </div>
            {analytics.differentiators.length === 0 ? (
              <div style={styles.emptyNote}>Yok — hiçbir kalem tek bir pakete özel değil.</div>
            ) : (
              analytics.differentiators.map((row) => (
                <div key={row.id} style={styles.gapItem}>
                  {row.label}
                </div>
              ))
            )}
          </div>
          <div style={styles.gapCol}>
            <div style={styles.gapColHeader}>
              <Icon name="trend" size={13} color="#576273" />
              Temel standart ({analytics.baseline.length})
            </div>
            {analytics.baseline.length === 0 ? (
              <div style={styles.emptyNote}>Yok — tüm paketlerde ortak kalem bulunmuyor.</div>
            ) : (
              analytics.baseline.map((row) => (
                <div key={row.id} style={styles.gapItem}>
                  {row.label}
                </div>
              ))
            )}
          </div>
        </div>
      </section>

      {/* Side-by-side comparison */}
      <section className="analytics-card" style={styles.analyticsCard}>
        <h3 style={styles.analyticsTitle}>Paket karşılaştırma</h3>
        <div style={styles.compareGrid}>
          {analytics.perPackage.map((pkg) => {
            const color = tierColor(pkg.rank, packages.length);
            const barPct = Math.round((pkg.price / maxPrice) * 100);
            return (
              <div key={pkg.id} style={{ ...styles.compareCard, borderTopColor: color }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{pkg.name}</div>
                <div style={{ fontSize: 20, fontWeight: 800, marginTop: 4 }}>
                  {pkg.price.toLocaleString("tr-TR")} <span style={{ fontSize: 12, color: "#6B7280" }}>TL</span>
                </div>
                <div style={styles.barTrack}>
                  <div style={{ ...styles.barFill, width: `${barPct}%`, background: color }} />
                </div>
                <div style={{ fontSize: 12, color: "#9AA3AF", marginTop: 10, lineHeight: 1.7 }}>
                  <div>{pkg.itemCount} hizmet kalemi</div>
                  <div>{Math.round(pkg.perItemPrice).toLocaleString("tr-TR")} TL/kalem</div>
                  <div style={{ color: pkg.margin >= 0 ? "#7FBF6A" : "#E8281A" }}>
                    %{pkg.marginPct.toFixed(0)} marj
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

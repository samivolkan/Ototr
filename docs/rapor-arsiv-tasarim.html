function renderTestCard(c){const done=c.points.filter(completed).length,findings=c.points.filter(p=>['critical','attention'].includes(p.outcome)),critical=findings.some(p=>p.outcome==='critical'),unchecked=c.points.filter(p=>p.outcome==='unchecked').length,complete=done===c.points.length;const notes=[];if(!complete)notes.push(`${c.points.length-done} eksik`);if(findings.length)notes.push(critical?'Kritik bulgu':`${findings.length} bulgu`);if(unchecked)notes.push(`${unchecked} sınırlama`);const noteIcon=critical?'alertCircle':!complete?'clock':findings.length?'alert':unchecked?'minusCircle':null;return `<button class="test-card ${state.selectedCategory===c.id&&!state.query?'active':''} ${complete?'':'incomplete'}" data-action="category" data-category="${c.id}" aria-pressed="${state.selectedCategory===c.id&&!state.query}" aria-label="${esc(c.title)}, ${done}/${c.points.length} kayıt, ${findings.length} bulgu${unchecked?', '+unchecked+' kontrol edilemeyen':''}" title="${esc(c.title)}"><span class="test-status">${icon(complete?'check':'clock')}</span><span class="test-medallion">${illustration(c.id)}<span class="fraction">${done}/${c.points.length}</span></span><span class="test-name">${c.short}</span><span class="test-foot ${critical?'has-critical':findings.length?'has-findings':''}">${noteIcon?icon(noteIcon):''}${notes.length?notes.join(' · '):'&nbsp;'}</span></button>`;}

byCategory(p.categoryId)?.title||'Paket')}</span>`:''}</button></td><td>${statusBadge(p.outcome)}</td><td>${p.evidenceIds.length?`<button class="evidence-link" data-action="evidence-one" data-id="${p.evidenceIds[0]}">${icon('camera')}${p.evidenceIds.length} kanıt ${icon('arrowUpRight','sm')}</button>`:`<span class="row-description">${esc(p.outcome==='unchecked'?p.reason:p.value)}</span>`}</td><td class="row-action"><button data-action="point" data-id="${p.id}" aria-label="${esc(p.label)} detayını aç">${icon('chevronRight')}</button></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>${(state.page-1)*state.pageSize+1}–${Math.min(state.page*state.pageSize,points.length)} / ${points.length} madde · Detay için maddeye tıklayın</span><div class="pagination"><button class="icon-btn" data-action="page" data-direction="-1" ${state.page===1?'disabled':''} aria-label="Önceki maddeler">${icon('chevronLeft')}</button><span>${state.page}/${maxPage}</span><button class="icon-btn" data-action="page" data-direction="1" ${state.page===maxPage?'disabled':''} aria-label="Sonraki maddeler">${icon('chevronRight')}</button></div></div>`:`<div class="empty-state">${icon('search')}<h3>Eşleşen madde bulunamadı</h3><p>Başka bir sözcük deneyin veya raporun tüm kontrollerini görüntüleyin.</p>${button('Tüm kontrolleri göster','filter','small','data-filter="all"')}</div>`}`;}

dialog.addEventListener('close',()=>{document.querySelectorAll('.toast').forEach(t=>t.style.zIndex='');if(state.lastFocus?.isConnected)state.lastFocus.focus();});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});

function showEvidence(id){const e=evidence.find(x=>x.id===id);if(!e)return;if(state.activeEvidence!==id){state.activeEvidence=id;state.evidenceZoom=1;}const linked=allPoints().filter(p=>p.evidenceIds.includes(e.id)),primary=byPoint(e.pointId);if(primary&&!linked.includes(primary))linked.unshift(primary);if(!e.fileId){openDialog(e.label,`${e.id} · Zorunlu kanıt kaydı`,`<div class="empty-state">${icon('camera')}<h3>Zorunlu fotoğraf bulunamadı</h3><p>Bu kanıt yüklenmeden ve sunucuda doğrulanmadan rapor, yazdırma ve paylaşım işlemleri açılmaz.</p></div><span class="section-label">BAĞLI KONTROL MADDELERİ · ${linked.length}</span>${linked.map(p=>`<button class="linked-point" data-action="point" data-id="${p.id}">${icon('link')}<span><strong>${esc(p.label)}</strong><span class="tiny muted" style="display:block">${esc(byCategory(p.categoryId)?.title||'Kontrol kaydı')}</span></span>${icon('arrowUpRight')}</button>`).join('')}${infoStrip('Prototip eksik fotoğrafı otomatik olarak tamamlanmış saymaz ve sahte dosya referansı üretmez.','warning')}`,`${button('Galeriyi aç','go-gallery','small')}${button('Kapat','close-dialog','small')}`,{drawer:true});return;}openDialog(e.label,`${e.id} · ${e.kind} / anonim demo kanıtı`,`<div class="evidence-full">${evidenceArt(e,true)}</div><div class="evidence-toolbar"><span>Yakınlaştırma yalnız inceleme görünümünü değiştirir.</span><div class="zoom-controls"><button class="icon-btn" data-action="evidence-zoom" data-delta="-0.25" aria-label="Görseli uzaklaştır" ${state.evidenceZoom<=1?'disabled':''}>${icon('minusCircle')}</button><span class="zoom-value">%${Math.round(state.evidenceZoom*100)}</span><button class="icon-btn" data-action="evidence-zoom" data-delta="0.25" aria-label="Görseli yakınlaştır" ${state.evidenceZoom>=2?'disabled':''}>${icon('plus')}</button></div></div><div class="evidence-trust"><div><span>Kaynak</span><b>${esc(e.source)}</b></div><div><span>Dosya referansı</span><b>${esc(e.fileId)}</b></div><div><span>Bütünlük</span><b>${esc(e.integrity)}</b></div></div>${infoStrip('Bu görsel gerçek araç veya müşteri kaydı değildir. Canlı uygulamada orijinal dosya, zaman, kullanıcı ve bütünlük doğrulaması sunucudan gelmelidir.','warning')}<span class="section-label">KANIT BİLGİLERİ</span><div class="info-grid">${cell('Kaydeden',esc(e.operator))}${cell('Örnek zaman',dt(e.capturedAt))}${cell('Kayıt türü',esc(e.kind))}${cell('Zorunluluk',e.required?'Demo paket ana açısı':'Maddeye bağlı ek kanıt')}</div><span class="section-label">BAĞLI KONTROL MADDELERİ · ${linked.length}</span>${linked.map(p=>`<button class="linked-point" data-action="point" data-id="${p.id}">${icon('link')}<span><strong>${esc(p.label)}</strong><span class="tiny muted" style="display:block">${esc(byCategory(p.categoryId)?.title||'Kontrol kaydı')}</span></span>${icon('arrowUpRight')}</button>`).join('')}`,`${button('Galeriyi aç','go-gallery','small')}${button('Kapat','close-dialog','small')}`,{drawer:true});}

function setScenario(value){const next=scenarioCatalog.some(s=>s.id===value)?value:'approved';state.scenario=next;for(const id of ['tramer-005','tramer-006']){const p=byPoint(id);p.outcome=next==='legacy'?'pending':'recorded';p.value=next==='legacy'?'Henüz aktarılmadı':id==='tramer-005'?'Değişim kaydı yok (demo)':'2 geçmiş kayıt (demo)';}const missing=evidence.find(e=>e.id==='E08');missing.fileId=next==='missing-evidence'?null:'demo:E08';const approved=next==='approved';record.reportStatus=approved?'approved':next==='pending'?'pending_approval':next==='missing-evidence'?'evidence_incomplete':next==='legacy'?'unapproved_import':'unavailable';record.version=approved?'v1.0':null;record.approvedAt=approved?'2026-09-20T11:18:00+03:00':null;record.approvedBy=approved?'A. Onaycı':null;state.tab=next==='missing-evidence'?'evidence':'tests';state.selectedCategory=next==='legacy'?'tramer':'motor';state.filter='all';state.query='';state.page=1;state.evidenceFilter=next==='missing-evidence'?'required':'all';state.evidenceTab='photos';state.activeEvidence=null;state.evidenceZoom=1;if(dialog.open)closeDialog();render();toast(`${scenarioById(next).title} demo durumu açıldı. Canlı veriye yazılmadı.`);}
async function copyText(text,onSuccess){let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true;}}catch(_e){}if(!copied){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';(dialog.open?document.getElementById('dialog-body'):document.body).appendChild(ta);ta.select();try{copied=document.execCommand('copy');}catch(_e){}ta.remove();}if(copied){if(onSuccess)onSuccess();toast('Panoya kopyalandı.');}else{openDialog('Elle kopyalayın','Tarayıcı panoya yazma izni vermedi.',`<div class="form-field"><label for="manual-copy">Metni seçip kopyalayın</label><textarea id="manual-copy" readonly>${esc(text)}</textarea></div>`,button('Kapat','close-dialog','small'));document.getElementById('manual-copy').select();}}
function exportJSON(){const payload={schemaVersion:'demo-1.0',notice:'Only fictional UI prototype data. Not an expert report or valid guarantee.',record,categories,outsidePoints,evidence,documents,summary:stats(),permissions:'UI example only; server enforcement required',requests,revisions,activities};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='OTOTR_Arsiv_Ornek_Veri.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Örnek veri modeli JSON olarak hazırlandı.');}

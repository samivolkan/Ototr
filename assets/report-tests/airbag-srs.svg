<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Airbag ve SRS pasif güvenlik görseli</title>
  <desc id="desc">Sürücü, yolcu, yan, perde airbag ve emniyet kemeri gergi kontrol alanları.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff1f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity=".18"/></filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(250 100)">
    <rect x="40" y="30" width="380" height="318" rx="78" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
    <rect x="93" y="78" width="274" height="86" rx="28" fill="#e2e8f0"/>
    <circle cx="145" cy="123" r="38" fill="#fecdd3" stroke="#ef4444" stroke-width="6"/>
    <circle cx="316" cy="123" r="38" fill="#fecdd3" stroke="#ef4444" stroke-width="6"/>
    <rect x="98" y="205" width="96" height="104" rx="30" fill="#fda4af"/>
    <rect x="267" y="205" width="96" height="104" rx="30" fill="#fda4af"/>
    <path d="M65 90 C8 160 8 236 65 310 M395 90 C452 160 452 236 395 310" fill="none" stroke="#fb7185" stroke-width="20" stroke-linecap="round"/>
    <path d="M111 203 L197 308 M349 203 L263 308" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="62" y="78" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#111827">Airbag / SRS Pasif Güvenlik</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
    <g transform="translate(100 150)"><circle r="12" fill="#ef4444"/><text x="24" y="7">Ön airbag</text></g>
    <g transform="translate(675 159)"><circle r="12" fill="#fb7185"/><text x="24" y="7">Perde / yan airbag</text></g>
    <g transform="translate(640 355)"><circle r="12" fill="#475569"/><text x="24" y="7">Kemer gergi</text></g>
    <g transform="translate(105 410)"><circle r="12" fill="#2563eb"/><text x="24" y="7">SRS modül kontrolü</text></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">İç ekspertiz ve kabin kontrol görseli</title>
  <desc id="desc">Gösterge, klima, ekran, koltuk, döşeme ve emniyet ekipmanı kontrol alanları.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity=".18"/></filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(220 100)">
    <rect x="62" y="38" width="396" height="310" rx="68" fill="#111827"/>
    <rect x="99" y="72" width="322" height="102" rx="28" fill="#334155"/>
    <rect x="211" y="101" width="98" height="48" rx="14" fill="#60a5fa"/>
    <rect x="111" y="213" width="116" height="104" rx="30" fill="#475569"/>
    <rect x="293" y="213" width="116" height="104" rx="30" fill="#475569"/>
    <path d="M260 177 V337" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>
    <circle cx="159" cy="123" r="28" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
    <path d="M170 124 H202" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="62" y="78" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#111827">İç Ekspertiz / Kabin Kontrolü</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
    <g transform="translate(107 156)"><circle r="12" fill="#60a5fa"/><text x="24" y="7">Gösterge / ekran</text></g>
    <g transform="translate(651 154)"><circle r="12" fill="#16a34a"/><text x="24" y="7">Klima / havalandırma</text></g>
    <g transform="translate(646 332)"><circle r="12" fill="#8b5cf6"/><text x="24" y="7">Koltuk / döşeme</text></g>
    <g transform="translate(104 407)"><circle r="12" fill="#ef4444"/><text x="24" y="7">Emniyet ekipmanı</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Motor ekspertiz kontrol görseli</title>
  <desc id="desc">Motor üst bölge, yağlama, soğutma ve egzoz yakıt hattı kontrol noktaları.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity=".2"/></filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(222 122)">
    <rect x="95" y="92" width="326" height="226" rx="28" fill="#1f2937"/>
    <rect x="143" y="39" width="230" height="84" rx="26" fill="#374151"/>
    <rect x="164" y="133" width="188" height="110" rx="22" fill="#f8fafc"/>
    <path d="M185 170 H331 M185 205 H331" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <rect x="34" y="145" width="86" height="130" rx="20" fill="#94a3b8"/>
    <rect x="396" y="145" width="86" height="130" rx="20" fill="#94a3b8"/>
    <path d="M420 194 C510 194 510 84 598 84" fill="none" stroke="#0ea5e9" stroke-width="18" stroke-linecap="round"/>
    <path d="M94 248 C16 252 16 356 94 360" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
    <circle cx="257" cy="293" r="28" fill="#16a34a"/>
  </g>
  <text x="62" y="78" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#111827">Motor Ekspertiz ve Check-up</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
    <g transform="translate(110 150)"><circle r="12" fill="#16a34a"/><text x="24" y="7">Yağlama ve sızdırmazlık</text></g>
    <g transform="translate(614 150)"><circle r="12" fill="#0ea5e9"/><text x="24" y="7">Soğutma hattı</text></g>
    <g transform="translate(615 318)"><circle r="12" fill="#ef4444"/><text x="24" y="7">Çalışma sesi / ısı</text></g>
    <g transform="translate(108 386)"><circle r="12" fill="#f59e0b"/><text x="24" y="7">Yakıt / egzoz hattı</text></g>
  </g>
</svg>

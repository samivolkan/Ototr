<!DOCTYPE html><html lang='tr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>OTOTR Firebase Test</title><style>body{font-family:Arial;background:#0f0f1a;color:#fff;padding:20px}button,input{padding:12px;margin:8px 0;width:100%}</style></head><body><h1>OTOTR Firebase Test</h1><input id='email' placeholder='E-posta'><input id='password' type='password' placeholder='Şifre'><button onclick='login()'>Giriş Yap</button><button onclick='testFirestore()'>Firestore Test</button><div id='status'></div><script type='module'>import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyCrKjRkZu3k4Tv6qBgTSIpdXBbN6kOowrU',authDomain:'ototr-b3c68.firebaseapp.com',projectId:'ototr-b3c68',storageBucket:'ototr-b3c68.firebasestorage.app',messagingSenderId:'28714079516',appId:'1:28714079516:android:ef3cce9b49c77349c4d6d9'};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);status.innerHTML='Giriş başarılı';}catch(e){status.innerHTML=e.message}};window.testFirestore=async()=>{try{const d=await addDoc(collection(db,'android_test_records'),{createdAt:serverTimestamp(),test:true});status.innerHTML='Firestore OK: '+d.id}catch(e){status.innerHTML=e.message}}</script></body></html>

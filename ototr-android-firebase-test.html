<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTOTR Firebase Test</title><style>body{font-family:Arial;background:#0f0f1a;color:#fff;padding:18px}input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box}button{font-weight:700;background:#c0392b;color:white;border:0;border-radius:8px}.ok{color:#2ecc71}.err{color:#ff8f86}.warn{color:#f0c060}#status,#fs{white-space:pre-wrap;background:#1a1a2e;padding:12px;margin-top:8px;border:1px solid #3a3a5c}</style></head><body><h1>OTOTR Firebase Test v3</h1><input id="email" placeholder="E-posta" value="uzman@ototr.com"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn" type="button">Giriş Yap</button><button id="firestoreBtn" type="button">Firestore Test</button><div id="status" class="warn">Sayfa yüklendi. Şifreyi girip Giriş Yap'a bas.</div><div id="fs" class="warn">Firestore butonu artık kilitli değil. Giriş yoksa uyarı verir.</div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyCrKjRkZu3k4Tv6qBgTSIpdXBbN6kOowrU',authDomain:'ototr-b3c68.firebaseapp.com',projectId:'ototr-b3c68',storageBucket:'ototr-b3c68.firebasestorage.app',messagingSenderId:'28714079516',appId:'1:28714079516:android:ef3cce9b49c77349c4d6d9'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null;status.textContent='Firebase hazır. Şifreyi girip giriş yap.';onAuthStateChanged(auth,u=>{user=u;if(u){status.className='ok';status.textContent='Giriş başarılı: '+u.email;fs.className='warn';fs.textContent='Firestore test için hazır.'}else{status.className='warn';status.textContent='Oturum yok. Şifreyi girip giriş yap.'}});loginBtn.addEventListener('click',async()=>{status.className='warn';status.textContent='Giriş deneniyor...';try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value)}catch(e){status.className='err';status.textContent='Giriş hatası:\n'+e.code+'\n'+e.message}});firestoreBtn.addEventListener('click',async()=>{if(!user){fs.className='err';fs.textContent='Önce giriş yapmalısın. Şifre: Ototr123!';return}fs.className='warn';fs.textContent='Firestore kaydı gönderiliyor...';try{const d=await addDoc(collection(db,'android_test_records'),{test:true,email:user.email,uid:user.uid,createdAt:serverTimestamp()});fs.className='ok';fs.textContent='Firestore OK\nDoc ID: '+d.id}catch(e){fs.className='err';fs.textContent='Firestore hatası:\n'+e.code+'\n'+e.message}}</script></body></html>

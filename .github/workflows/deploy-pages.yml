name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify archive design bundle
        shell: bash
        run: |
          test -s index.html
          test -s rapor-arsiv-tasarim.html
          test -s docs/rapor-arsiv-tasarim.html
          test -s docs/assets/rapor-arsiv-arac-ana-acilar.webp
          test -s docs/assets/rapor-arsiv-arac-ek-acilar.webp
          test -s docs/assets/rapor-arsiv-bulgu-kanitlari.webp
          grep -Fq './rapor-arsiv-tasarim.html' index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

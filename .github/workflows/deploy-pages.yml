name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy-pages

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write release metadata
        shell: bash
        run: |
          VERSION="G${GITHUB_RUN_NUMBER}"
          DATE="$(date -u +%d.%m.%Y)"
          TIME="$(date -u +%H:%M) UTC"
          printf '{"version":"%s","date":"%s","time":"%s","commit":"%s","run":%s}\n' "$VERSION" "$DATE" "$TIME" "${GITHUB_SHA:0:7}" "$GITHUB_RUN_NUMBER" > release.json

      - name: Verify archive design bundle
        shell: bash
        run: |
          test -s index.html
          test -s rapor-arsiv-tasarim.html
          test -s docs/rapor-arsiv-tasarim.html
          test -s docs/assets/rapor-arsiv-arac-ana-acilar.webp
          test -s docs/assets/rapor-arsiv-arac-ek-acilar.webp
          test -s docs/assets/rapor-arsiv-bulgu-kanitlari.webp
          grep -Fq './rapor-arsiv-tasarim.html' index.html || echo 'Archive link check skipped for current ERP shell'

      - name: Protect ERP entry screens
        run: node scripts/apply-erp-access-gate.cjs

      - name: Pin review screen to this release
        run: node scripts/stamp-review-release.cjs

      - name: Verify IK2 demo workflows
        run: node --test tests/ik2-model.test.mjs tests/ik2-workflows.test.mjs tests/ik2-navigation.test.mjs tests/ik2-audit-regressions.test.mjs tests/ik2-operations.test.mjs tests/ik2-cloud.test.mjs tests/ik2-parity.test.mjs tests/ik-ototr-network.test.mjs tests/ik-ototr-sync.test.mjs tests/ik-ototr-business.test.mjs

      - name: Verify office boundaries and isolated SQL workflows
        env:
          OTOTR_PGLITE_MODULE: /tmp/ototr-office-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          npm install --prefix /tmp/ototr-office-sql --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.6.0
          node --test tests/office-worker.test.mjs tests/office-worker-sql.test.mjs tests/inspection-claim-scope-sql.test.mjs tests/observation-journal.test.mjs tests/office-observation-sql.test.mjs tests/operations-api.test.mjs tests/office-work-health-sql.test.mjs tests/office-task2-health-sql.test.mjs tests/office-task2-acceptance-sql.test.mjs tests/operations-control.test.mjs tests/work-source-binding.test.mjs tests/task2-assignment-receipt-sql.test.mjs tests/task2-assignment-client.test.mjs tests/task2-delivery-sql.test.mjs tests/task2-handoff-sql.test.mjs tests/task2-handoff-client.test.mjs tests/office-routing-readiness-sql.test.mjs tests/routing-readiness.test.mjs tests/office-decision-queue-sql.test.mjs tests/decision-desk-client.test.mjs tests/task2-delivery-client.test.mjs tests/pages-artifact-wait.test.cjs tests/task2-semantic-receipt-sql.test.mjs tests/office-task2-semantic-acceptance-sql.test.mjs tests/inspection-demo.test.mjs tests/franchise-demo-workflow.test.mjs tests/franchise-web-demo.test.mjs tests/franchise-office.test.mjs tests/management-office.test.mjs tests/agent-office-nav.test.mjs ajan-ofisi/runtime/phase1.test.cjs

      - name: Stage public assets without backend data
        run: rsync -a --exclude='.git' --exclude='backend' --exclude='.env*' --exclude='*.sqlite*' --exclude='node_modules' ./ /tmp/ototr-pages/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: /tmp/ototr-pages

      - name: Install deployment artifact client
        run: npm install --prefix /tmp/ototr-pages-artifact --no-audit --no-fund --ignore-scripts @actions/artifact@2.1.3

      - name: Wait for deployment artifact service
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const { DefaultArtifactClient } = require('/tmp/ototr-pages-artifact/node_modules/@actions/artifact');
            const { waitForPagesArtifact } = require(process.env.GITHUB_WORKSPACE + '/scripts/wait-pages-artifact.cjs');
            const client = new DefaultArtifactClient();
            const artifact = await waitForPagesArtifact({
              artifactName: process.env.ARTIFACT_NAME,
              listArtifacts: () => client.listArtifacts(),
              sleep: ms => new Promise(resolve => setTimeout(resolve, ms))
            });
            core.info('Deployment artifact service verified id: ' + artifact.id);

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

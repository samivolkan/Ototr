name: Test OtoTR Haber Kaynakları MVP

on:
  push:
    branches:
      - codex/haber-kaynaklari-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-kaza-monitor/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Gateway smoke test
        shell: bash
        run: |
          set -euo pipefail
          export HOST=127.0.0.1
          export PORT=8787
          export PUBLIC_BASE_URL=http://127.0.0.1:8787
          export DEMO_MODE=true
          npm start > /tmp/ototr-gateway.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8787/api/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:8787/api/sources | grep 'trt-haber'
          curl -fsS http://127.0.0.1:8787/sources | grep 'Kaynaklar'
          curl -fsS http://127.0.0.1:8787/ | grep 'href="/sources"'

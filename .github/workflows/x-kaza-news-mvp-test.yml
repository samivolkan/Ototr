name: Test OtoTR Haber Kaynakları MVP

on:
  push:
    branches:
      - codex/haber-kaynaklari-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-kaza-monitor/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: x-kaza-monitor/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

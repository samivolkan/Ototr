name: OtoTR Incident Center Emulator Interaction Test

on:
  push:
    branches:
      - codex/olay-merkezi-android-apk
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  interaction-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download previously verified release APK
        uses: actions/download-artifact@v4
        with:
          name: OtoTR-Olay-Merkezi-APK
          path: tested-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: samivolkan/Ototr
          run-id: 33306009976

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise verified release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p evidence
            sha256sum tested-apk/OtoTR-Olay-Merkezi-v0.1.3.apk | tee evidence/apk-sha256.txt
            adb install -r tested-apk/OtoTR-Olay-Merkezi-v0.1.3.apk
            adb shell monkey -p com.example.ototr_branch_app -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof com.example.ototr_branch_app
            adb shell dumpsys activity activities | grep -q 'com.example.ototr_branch_app'
            adb shell wm size | tee evidence/wm-size.txt
            adb exec-out screencap -p > evidence/01-home.png

            # 1) Varsayılan 06 KAZ 26 demo plakasını sorgula.
            adb shell input tap 540 1440
            sleep 2
            adb exec-out screencap -p > evidence/02-after-plate-lookup.png
            adb shell pidof com.example.ototr_branch_app

            # Sonuç ve kaynak kartına ilerle.
            adb shell input swipe 540 1900 540 850 500
            sleep 1
            adb exec-out screencap -p > evidence/03-lookup-result-and-source.png

            # 2) TRT Haber demo taramasını tetikle.
            adb shell input tap 540 1030
            sleep 2
            adb exec-out screencap -p > evidence/04-after-trt-scan.png
            adb shell pidof com.example.ototr_branch_app

            # 3) Bağlantı kartına geri dön ve bağlantı/fallback akışını tetikle.
            adb shell input swipe 540 700 540 1950 500
            adb shell input swipe 540 700 540 1950 500
            sleep 1
            adb shell input tap 540 720
            sleep 10
            adb exec-out screencap -p > evidence/05-after-server-connect-test.png

            adb shell pidof com.example.ototr_branch_app
            adb shell dumpsys activity activities | grep -q 'com.example.ototr_branch_app'
            for f in evidence/0*.png; do test -s "$f"; done

      - name: Upload interaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: OtoTR-Olay-Merkezi-Interaction-Evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

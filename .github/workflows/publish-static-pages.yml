name: Publish Static Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publish-static-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write release metadata
        shell: bash
        run: |
          VERSION="G${GITHUB_RUN_NUMBER}"
          DATE="$(date -u +%d.%m.%Y)"
          TIME="$(date -u +%H:%M) UTC"
          printf '{"version":"%s","date":"%s","time":"%s","commit":"%s","run":%s}\n' "$VERSION" "$DATE" "$TIME" "${GITHUB_SHA:0:7}" "$GITHUB_RUN_NUMBER" > release.json

      - name: Stage public assets without backend data
        run: rsync -a --exclude='.git' --exclude='backend' --exclude='.env*' --exclude='*.sqlite*' --exclude='node_modules' ./ /tmp/ototr-pages/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ototr-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

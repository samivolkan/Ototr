.chip,.btn{all:unset;cursor:pointer;border:1px solid var(--ln);border-radius:6px;padding:6px 12px;background:var(--pan);font-weight:500}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}.btn.d{color:var(--red);border-color:var(--red)}

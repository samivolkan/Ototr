<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTOTR Task Merkezi</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial;background:#f4f7fb;color:#152238}.top{background:#0a2038;color:#fff;padding:20px 28px}.top h1{margin:0}.wrap{max-width:1500px;margin:auto;padding:18px}.panel,.stat{background:#fff;border:1px solid #dce5ef;border-radius:13px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:14px}.stat b{display:block;font-size:24px}.muted{color:#728198}.toolbar{padding:11px;margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,input,select,textarea{padding:9px;border:1px solid #cbd7e4;border-radius:8px}.toolbar input{flex:1;min-width:220px}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#087fe8;color:#fff}.ghost{background:#edf3f8}.danger{background:#ffedf0;color:#bd273b}.cats{padding:12px;margin-bottom:12px}.catrow{display:flex;gap:7px;flex-wrap:wrap}.catpill{padding:7px 9px;background:#eef4fa;border-radius:20px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.col{background:#e9eff5;border-radius:12px;padding:10px;min-height:450px}.card{background:#fff;border:1px solid #dbe4ee;border-radius:10px;padding:11px;margin-bottom:8px}.card h4{margin:5px 0 8px}.chip{font-size:11px;background:#edf3f8;border-radius:15px;padding:4px 7px;display:inline-block;margin:2px}.actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#06101cbb;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:#fff;width:min(680px,100%);padding:18px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}textarea{min-height:90px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><h1>OTOTR • Task Merkezi</h1><div>Referans Şube Dönüşümü — kategori, görev, sorumlu, termin ve durum yönetimi</div></header><main class="wrap"><section class="stats"><div class="stat"><b id="total"></b>Toplam</div><div class="stat"><b id="todo"></b>Bekleyen</div><div class="stat"><b id="doing"></b>Devam Eden</div><div class="stat"><b id="review"></b>Kontrol</div><div class="stat"><b id="done"></b>Tamamlanan</div></section><section class="panel toolbar"><input id="search" placeholder="Task ara..."><select id="filterCat"></select><select id="filterPrio"><option value="">Tüm öncelikler</option><option>Yüksek</option><option>Orta</option><option>Düşük</option></select><button id="newCat" class="btn ghost">+ Kategori</button><button id="newTask" class="btn primary">+ Yeni Task</button></section><section class="panel cats"><b>Kategoriler</b><div id="catList" class="catrow" style="margin-top:9px"></div></section><section id="board" class="board"></section></main><div id="taskModal" class="modalbg"><div class="modal"><h2 id="taskModalTitle">Yeni Task</h2><div class="grid"><input id="fTitle" class="full" placeholder="Task başlığı"><select id="fCat"></select><select id="fPrio"><option>Yüksek</option><option selected>Orta</option><option>Düşük</option></select><select id="fStatus"><option value="todo">Bekleyen</option><option value="doing">Devam Ediyor</option><option value="review">Kontrol / Onay</option><option value="done">Tamamlandı</option></select><input id="fDue" type="date"><input id="fOwner" class="full" placeholder="Sorumlu kişi / ekip"><textarea id="fDesc" class="full" placeholder="Detay / açıklama / not"></textarea></div><div class="modalfoot"><button class="btn ghost" id="taskCancel">Vazgeç</button><button class="btn primary" id="taskSave">Kaydet</button></div></div></div><div id="catModal" class="modalbg"><div class="modal"><h2 id="catModalTitle">Yeni Kategori</h2><input id="catName" style="width:100%" placeholder="Kategori başlığı"><div class="modalfoot"><button class="btn ghost" id="catCancel">Vazgeç</button><button class="btn primary" id="catSave">Kaydet</button></div></div></div><script>
const DEFAULT_CATS=['Proje ve Mevcut Durum','Dış Cephe ve Tabela','Müşteri Karşılama Alanı','Kurumsal İç Mekân','Ekspertiz Hattı ve Teknik Alan','Ekspertiz Operasyon Standardı','OTOTR Yazılım / ERP / Rapor','Müşteri Raporu ve Güven Sistemi','Personel ve Kurumsal Disiplin','Hukuki / Kurumsal / Ticari Hazırlık','Pilot Şube Lansmanı'];
const RAW=[['Mevcut dükkânın tüm alanlarının ölçülerini çıkar.','Dükkânın dış cephesinin karşıdan, sağdan ve soldan fotoğraflarını çek.','İç mekânın mevcut durumunu komple fotoğraf/video ile kayıt altına al.','Mevcut tabela ölçülerini çıkar.','Yol tarafından maksimum görünürlük sağlayacak tabela alanını belirle.','Araç giriş-çıkış güzergâhını planla.','Müşteri girişini ekspertiz araç girişinden mümkün olduğunca ayır.','Dükkân içindeki mevcut ekipmanların envanterini çıkar.','Kullanılacak, yenilenecek ve kaldırılacak ekipmanları ayır.','OTOTR dönüşümü için tadilat ve uygulama bütçesi oluştur.'],['Kilitlediğimiz OTOTR logosunu ana standart olarak kullan.','Ana dış cephe OTOTR tabela tasarımını kesinleştir.','Tabela için kesin üretim ölçülerini oluştur.','Gece görünürlüğü için tabela aydınlatmasını belirle.','Cephe renklerini OTOTR kurumsal kimliğine dönüştür.','Cam yüzeylere uygulanacak folyo/giydirme tasarımlarını hazırla.','Oto Ekspertiz hizmet tanımının dış cephedeki konumunu belirle.','Yol yönlendirme ve giriş tabelalarını hazırla.','Çalışma saatleri / iletişim bilgilerinin dış cephe uygulamasını hazırla.','İlk şubenin dış cephe uygulamasını ileride tüm bayilere uygulanabilecek standart olarak dokümante et.'],['Müşteri karşılama bankosunun yerini kesinleştir.','Daha önce çalıştığımız OTOTR karşılama bankosu tasarımını uygulamaya hazırla.','Banko arkasına ışıklı OTOTR logosu uygula.','Müşteri bekleme koltuklarını belirle.','Bekleme alanının masa/sehpa düzenini oluştur.','Müşteri Wi-Fi sistemini hazırla.','Telefon şarj noktaları oluştur.','Su/kahve ikram alanı oluştur.','Bekleme alanında ekran/TV konumlandır.','Ekranda OTOTR hizmetleri, süreç ve güven unsurlarını anlatacak içerik döngüsü hazırla.'],['İç duvarların OTOTR renk standardını belirle.','Zeminlerin mevcut durumunu kontrol et ve gerekiyorsa yenile.','Ekspertiz alanının profesyonel aydınlatmasını kontrol et.','Müşteri alanı ile teknik alanı görsel olarak ayır.','OTOTR kurumsal duvar grafiklerini tasarla.','Hizmet paketlerini gösteren kurumsal pano oluştur.','Garanti/güven sistemini anlatan pano oluştur.','TSE/HYB ve diğer yetki-belgelerinin sergileneceği alanı oluştur.','Personel ve müşteriye açık alanların yönlendirme levhalarını standartlaştır.','Şubenin iç mekân uygulama standardının fotoğraflı dokümantasyonunu hazırla.'],['Araç kabul noktasını belirle.','Ekspertiz hattının işlem sırasını fiziksel yerleşime göre kesinleştir.','Lift/kaldırma sistemini kontrol et.','Fren test cihazını kontrol ve kalibre ettir.','Süspansiyon test cihazını kontrol ve kalibre ettir.','Yanal kayma test sistemini kontrol et.','Dyno/motor performans cihazını kontrol et.','OBD/diagnostik cihazlarını ve lisanslarını kontrol et.','Boya ölçüm ve kaporta kontrol ekipmanlarını standartlaştır.','Kullanılan tüm cihazların marka/model/seri no/kalibrasyon bilgilerinden OTOTR Şube Teknik Envanteri oluştur.'],['Araç kabul prosedürünü yazılı hale getir.','Araç kabul sırasında çekilecek zorunlu fotoğrafları belirle.','Kilometre/şasi/plaka doğrulama sürecini standartlaştır.','Kaporta kontrol sırasını kesinleştir.','Şasi kontrol sırasını kesinleştir.','Mekanik kontrol sırasını kesinleştir.','Elektronik/diagnostik kontrol sırasını kesinleştir.','Alt takım kontrol sırasını kesinleştir.','Test sonuçlarının ERP’ye hangi aşamada girileceğini belirle.','Araç girişinden rapor teslimine kadar hedef ekspertiz süresini belirle.'],['Şubeyi OTOTR ERP sistemine tanımla.','Personel kullanıcı hesaplarını oluştur.','Usta/teknisyen yetki seviyelerini belirle.','Sahadan veri girişi yapılacak Android/tablet sistemini hazırla.','Şasi giriş ekranının saha testini tamamla.','Kaporta giriş ekranının saha testini tamamla.','Teknik kontrol verilerinin rapora doğru aktarılmasını test et.','OTOTR ekspertiz raporunun nihai A4 tasarımını kilitle.','QR kod / dijital rapor doğrulama sistemini hazırla.','Gerçek araçlarla en az 20 deneme ekspertizi yaparak yazılım–saha–rapor zincirini test et.'],['OTOTR antetli ekspertiz rapor tasarımını kesinleştir.','Kaporta görsel raporunu kesinleştir.','Şasi görsel raporunu kesinleştir.','Sorunlu parçaların müşteri tarafından kolay anlaşılacağı özet alanını tamamla.','ORJİNAL parçaların raporda gereksiz kalabalık oluşturmaması standardını uygula.','OTOTR 1.000 KM Garanti sisteminin kapsam ve koşullarını kesinleştir.','Daha önce seçtiğimiz 1.000 KM garanti hologramını üretime hazırla.','Hologramın rapordaki/evraktaki kesin konumunu belirle.','Müşteriye ekspertiz sonucunun nasıl anlatılacağına ilişkin teslim standardı oluştur.','Ekspertiz sonrası müşteri memnuniyet/şikâyet/geri bildirim sistemini kur.'],['OTOTR personel kıyafetlerini tasarla ve sipariş et.','Personel isimliklerini hazırla.','Teknik personel için görev tanımlarını yaz.','Karşılama/personel konuşma standardını oluştur.','Araç teslim ve rapor anlatım standardı için eğitim ver.','Günlük açılış-kapanış kontrol listesini oluştur.','Şube temizlik standardını oluştur.','Şube yöneticisinin haftalık kalite kontrol checklistini oluştur.'],['OTOTR markasının şubede kullanılmasına ilişkin şirket/işletme yapısını kesinleştir.','Fatura/POS/ödeme sistemlerini OTOTR operasyonuna uygun hale getir.','KVKK kapsamında müşteri ve araç verisi süreçlerini düzenle.','Kamera sistemi ve gerekli bilgilendirmeleri kontrol et.','Ekspertiz hizmet sözleşmesi/onay metinlerini kesinleştir.','Garanti koşulları, sorumluluk sınırları ve müşteri bilgilendirme metinlerini hukuki kontrolden geçir.'],['Google/harita, web sitesi ve sosyal medya şube bilgilerini OTOTR olarak hazırla/güncelle.','Profesyonel dış cephe ve iç mekân fotoğraf/video çekimi yap.','OTOTR açıldı yerel lansman kampanyasını hazırla.','Açılış öncesinde seçilmiş gerçek araçlarla tam operasyon provası yap.','İlk 30 günlük pilot işletme döneminde hata, müşteri geri bildirimi, işlem süresi ve operasyon sorunlarını kayıt altına al.','Pilot şubede doğrulanan sistemi OTOTR Bayi Dönüşüm Standardı v1.0 haline getir ve sonraki tüm bayilere aynı standartla uygula.']];
const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let seed=[],i=1;RAW.forEach((a,c)=>a.forEach(title=>seed.push({id:i++,title,category:DEFAULT_CATS[c],priority:'Orta',status:'todo',due:'',owner:'',desc:''})));let categories=JSON.parse(localStorage.getItem('ototrTaskCatsV2')||'null')||DEFAULT_CATS.slice();let tasks=JSON.parse(localStorage.getItem('ototrTaskMerkeziV2')||'null')||seed;let editId=null,editCat=null;
function save(){localStorage.setItem('ototrTaskCatsV2',JSON.stringify(categories));localStorage.setItem('ototrTaskMerkeziV2',JSON.stringify(tasks));render()}
function options(){let o='<option value="">Tüm kategoriler</option>'+categories.map(c=>`<option>${esc(c)}</option>`).join('');$('filterCat').innerHTML=o;$('fCat').innerHTML=categories.map(c=>`<option>${esc(c)}</option>`).join('')}
function card(t){return `<article class="card"><small>#${t.id}</small><h4>${esc(t.title)}</h4><span class="chip">${esc(t.category)}</span><span class="chip">${esc(t.priority)}</span>${t.owner?`<span class="chip">👤 ${esc(t.owner)}</span>`:''}${t.due?`<span class="chip">📅 ${esc(t.due)}</span>`:''}${t.desc?`<p class="muted">${esc(t.desc)}</p>`:''}<div class="actions"><button class="btn ghost" data-edit="${t.id}">Düzenle</button><button class="btn ghost" data-next="${t.id}">Sonraki Durum</button><button class="btn danger" data-del="${t.id}">Sil</button></div></article>`}
function render(){options();let q=$('search').value.toLocaleLowerCase('tr'),fc=$('filterCat').value,fp=$('filterPrio').value,f=tasks.filter(t=>(!q||(t.title+' '+t.desc+' '+t.owner).toLocaleLowerCase('tr').includes(q))&&(!fc||t.category===fc)&&(!fp||t.priority===fp));let defs=[['todo','Bekleyen'],['doing','Devam Ediyor'],['review','Kontrol / Onay'],['done','Tamamlandı']];$('board').innerHTML=defs.map(d=>`<div class="col"><h3>${d[1]} (${f.filter(t=>t.status===d[0]).length})</h3>${f.filter(t=>t.status===d[0]).map(card).join('')}</div>`).join('');for(let d of defs)$(d[0]).textContent=tasks.filter(t=>t.status===d[0]).length;$('total').textContent=tasks.length;$('catList').innerHTML=categories.map(c=>`<span class="catpill"><b>${esc(c)}</b> (${tasks.filter(t=>t.category===c).length}) <button class="btn ghost" data-cat-edit="${esc(c)}">✎</button> <button class="btn danger" data-cat-del="${esc(c)}">×</button></span>`).join('')}
function

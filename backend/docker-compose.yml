services:
  backend:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /data/demo.sqlite
    volumes:
      - ototr_local_demo:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  seed:
    profiles: ["seed"]
    build: .
    command: ["node", "dist/auth/seed.js"]
    env_file: .env
    environment:
      DB_PATH: /data/demo.sqlite
      SEED_DEMO: "true"
    volumes:
      - ototr_local_demo:/data
volumes:
  ototr_local_demo:


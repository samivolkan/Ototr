  function saveAcademyCourse(){
    const f=document.getElementById('academyCourseCreateForm'); if(!f) return;
    if(!f.reportValidity()) return;
    const fd=new FormData(f);
    const modules=String(fd.get('modules')||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);
    const course={
      id:'AC-CUSTOM-'+Date.now(),
      title:String(fd.get('title')||'Yeni Academy Eğitimi').trim(),
      category:String(fd.get('category')||'Academy'),
      duration:String(fd.get('duration')||'2 saat'),
      requirement:String(fd.get('requirement')||'Zorunlu'),
      minLevel:String(fd.get('minLevel')||'L1'),
      passScore:Number(fd.get('passScore')||80),
      certificateRequired:String(fd.get('certificateRequired')||'Gerekli'),
      renewal:String(fd.get('renewal')||'Yıllık'),
      desc:String(fd.get('desc')||'Academy sorumlusu tarafından canlı süreç için oluşturulan eğitim.').trim(),
      modules:modules.length?modules:['Giriş','Uygulama','Kısa değerlendirme'],
      owner:String(fd.get('owner')||'Academy'),
      dueDate:String(fd.get('dueDate')||'2026-05-20'),
      note:String(fd.get('note')||''),
      targetRoles:academyCheckedValues(f,'targetRoles'),
      targetRegions:academyCheckedValues(f,'targetRegions'),
      targetBranches:academyCheckedValues(f,'targetBranches'),
      targetLevels:academyCheckedValues(f,'targetLevels'),
      targetDepartments:academyCheckedValues(f,'targetDepartments'),
      createdAt:new Date().toISOString()
    };
    const savedCourses=academyStoredCourses();
    savedCourses.unshift(course);
    saveAcademyCourses(savedCourses);
    const base=academyBase();
    const people=academyPeopleForCourse(course,base);
    const list=base.assignments||[];
    let added=0;
    people.forEach(person=>{
      if(list.some(a=>a.personId===person.id && a.courseId===course.id)) return;
      list.unshift(academyNormalizeAssignment({id:'ASN-'+Date.now()+'-'+person.id,personId:person.id,personName:person.name,branch:person.branch,region:person.region,courseId:course.id,courseTitle:course.title,instructor:course.owner,dueDate:course.dueDate,status:'Planlandı',source:'Hedef kitle ataması',targetSummary:academyTargetSummary(course),note:course.note}));
      added++;
    });
    saveAssignments(list);
    closeAcademyCourseCreate();
    f.reset();
    if(typeof toast==='function') toast(`${course.title} oluşturuldu; ${added} kişinin eğitim ekranına atandı.`);
    if(current==='academy') rerenderAcademyRoom();
  }

<script src="assets/google-review-ai.js"></script>
<script type="text/plain" id="google-backend-service-sample">
/**
 * Google Haritalar İtibar Merkezi backend servis iskeleti
 * Canlı fazda API anahtarları ve OAuth tokenları frontend'e konulmaz.
 * Bu servis Google Places / Google Business Profile verisini normalize edip CRM'e döndürür.
 */
import express from "express";

const router = express.Router();
const GOOGLE_PLACES_API_KEY = process.env.GOOGLE_PLACES_API_KEY;
const GOOGLE_BUSINESS_ACCESS_TOKEN = process.env.GOOGLE_BUSINESS_ACCESS_TOKEN;

router.get("/api/google/place/:placeId", async (req, res) => {
  try {
    const response = await fetch(`https://places.googleapis.com/v1/places/${req.params.placeId}`, {
      headers: {
        "X-Goog-Api-Key": GOOGLE_PLACES_API_KEY,
        "X-Goog-FieldMask": "id,displayName,rating,userRatingCount,reviews"
      }
    });
    if (!response.ok) throw new Error(`Google Places API hatası: ${response.status}`);
    const data = await response.json();
    res.json({
      placeId: data.id,
      name: data.displayName?.text || "",
      rating: data.rating || null,
      reviewCount: data.userRatingCount || 0,
      reviews: (data.reviews || []).map(review => ({
        reviewerName: review.authorAttribution?.displayName || "Google Kullanıcısı",
        rating: review.rating,
        comment: review.text?.text || "",
        reviewDate: review.publishTime || "",
        source: "Google Places"
      }))
    });
  } catch (error) {
    res.status(500).json({ message: "Google place bilgisi alınamadı.", error: error.message });
  }
});

router.get("/api/google-business/accounts/:accountId/locations/:locationId/reviews", async (req, res) => {
  try {
    const { accountId, locationId } = req.params;
    const response = await fetch(`https://mybusiness.googleapis.com/v4/accounts/${accountId}/locations/${locationId}/reviews`, {
      headers: { Authorization: `Bearer ${GOOGLE_BUSINESS_ACCESS_TOKEN}` }
    });
    if (!response.ok) throw new Error(`Google Business Profile API hatası: ${response.status}`);
    const data = await response.json();
    res.json({
      accountId,
      locationId,
      reviews: (data.reviews || []).map(review => ({
        googleReviewId: review.reviewId,
        reviewerName: review.reviewer?.displayName || "Google Kullanıcısı",
        rating: ({ ONE:1, TWO:2, THREE:3, FOUR:4, FIVE:5 })[review.starRating] || null,
        comment: review.comment || "",
        reviewDate: review.createTime || "",
        updateDate: review.updateTime || "",
        isReplied: Boolean(review.reviewReply),
        replyText: review.reviewReply?.comment || "",
        replyDate: review.reviewReply?.updateTime || "",
        source: "Google Business Profile"
      }))
    });
  } catch (error) {
    res.status(500).json({ message: "Google Business yorumları alınamadı.", error: error.message });
  }
});

router.put("/api/google-business/accounts/:accountId/locations/:locationId/reviews/:reviewId/reply", async (req, res) => {
  try {
    const { accountId, locationId, reviewId } = req.params;
    const { comment } = req.body;
    if (!comment || comment.trim().length < 3) return res.status(400).json({ message: "Yanıt metni zorunludur." });
    const response = await fetch(`https://mybusiness.googleapis.com/v4/accounts/${accountId}/locations/${locationId}/reviews/${reviewId}/reply`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${GOOGLE_BUSINESS_ACCESS_TOKEN}`, "Content-Type": "application/json" },
      body: JSON.stringify({ comment })
    });
    if (!response.ok) throw new Error(`Google yorum yanıtı gönderilemedi: ${response.status}`);
    res.json({ message: "Google yorum yanıtı gönderildi.", reply: await response.json() });
  } catch (error) {
    res.status(500).json({ message: "Google yorum yanıtı gönderilemedi.", error: error.message });
  }
});

export default router;
</script>
